<script>const course={"schemaVersion":1,"courseId":"english-grammar-foundations-v1","titleJa":"英検・大学受験の英文法と表現","publicationStatus":"unpublished","reviewStatus":"approved","purposeJa":"英検と大学受験の読解・空欄補充・英作文に向け、文脈と使い分けを学ぶオリジナル教材。","levelNoteJa":"難易度は教材作成上の目安です。英検公式問題・公式出題範囲・合格保証ではありません。","gradingPolicy":"saved-choice-index-no-runtime-ai","counts":{"lessons":36,"examples":144,"questions":216},"lessons":[{"id":"grammar-present-simple-continuous","series":"grammar","titleJa":"いつものことと、今進んでいること","levelTargets":["A2","B1","B2"],"goalJa":"習慣・状態と、一時的な活動を区別して読み、自分の生活や研究活動を説明する。","conceptJa":"現在形は習慣や状態を、現在進行形は進行中・一時的な活動を示すことが多い。時計の「今」だけで形を決めず、どんな見方で伝えるかを考える。","commonTrapJa":"nowがあれば必ず進行形、という決め方はしない。knowなどは現在の状態でも通常は現在形。","usageNotes":["I liveとI am livingのどちらも自然な場合があり、後者は一時的な住まいとして示しやすい。","thinkは意見ならI think、検討する活動ならI am thinkingのように意味で形が変わる。","入試の対比表現usually / this weekなどを、時間だけでなく習慣と例外の手掛かりとして読む。"],"examples":[{"id":"grammar-present-simple-continuous-ex1","text":"I review vocabulary on the train every morning.","meaningJa":"毎朝、電車で語彙を復習します。","contextJa":"普段の学習習慣を紹介する。"},{"id":"grammar-present-simple-continuous-ex2","text":"This week, I am preparing for a debate instead.","meaningJa":"今週は代わりにディベートの準備をしています。","contextJa":"いつもと違う一時的な活動。"},{"id":"grammar-present-simple-continuous-ex3","text":"I understand the question, but I need another example.","meaningJa":"質問は分かりますが、もう一つ例が必要です。","contextJa":"現在の理解という状態を伝える。"},{"id":"grammar-present-simple-continuous-ex4","text":"We are thinking about how to reduce food waste at school.","meaningJa":"学校の食品ロスを減らす方法を検討しています。","contextJa":"考える作業が進んでいる。"}],"contrasts":[{"leftEnglish":"She studies biology.","rightEnglish":"She is studying a leaf under the microscope.","noteJa":"左は学ぶ分野や習慣、右は今行っている観察。"},{"leftEnglish":"I think the explanation is clear.","rightEnglish":"I am thinking about your explanation.","noteJa":"左は意見、右は説明について考えている活動。"}],"questions":[{"id":"grammar-present-simple-continuous-q1","type":"context","scenarioJa":"一人の部長の、毎週の習慣を述べる。","prompt":"Our club leader ___ the riverbank with volunteers every Saturday.","choices":[{"text":"cleaned","feedbackJa":"過去の活動を述べる形です。"},{"text":"cleans","feedbackJa":"現在の習慣と一人の主語に合います。"},{"text":"has cleaning","feedbackJa":"この組み合わせは使いません。"},{"text":"clean","feedbackJa":"一人を表すOur club leaderには-sが必要です。"}],"correctIndex":1,"explanationJa":"毎週行う現在の習慣なので現在形。主語は一人のleaderでcleansにする。","focusJa":"現在の習慣"},{"id":"grammar-present-simple-continuous-q2","type":"context","scenarioJa":"今まさに試料を測定しているので、話しかけないでほしい。","prompt":"Please wait. I ___ the sample right now.","choices":[{"text":"measured","feedbackJa":"過去の測定になってしまいます。"},{"text":"have measure","feedbackJa":"haveの後の形が合いません。"},{"text":"was measure","feedbackJa":"wasと原形は結び付きません。"},{"text":"am measuring","feedbackJa":"進行中の測定を表します。"}],"correctIndex":3,"explanationJa":"作業の最中であることをam measuringで伝える。","focusJa":"進行中の動作"},{"id":"grammar-present-simple-continuous-q3","type":"usage","scenarioJa":"「その規則を知っています」と普通に伝える。","prompt":"Choose the standard neutral sentence.","choices":[{"text":"I know the rule.","feedbackJa":"knowは通常、状態を現在形で述べます。"},{"text":"I am knowing the rule.","feedbackJa":"この意味のknowは通常進行形にしません。"},{"text":"I knowing the rule.","feedbackJa":"述語になる形が不足しています。"},{"text":"I am know the rule.","feedbackJa":"beとknowの原形はこの形で使いません。"}],"correctIndex":0,"explanationJa":"知っている状態はI know。進行形にしないことが「今ではない」という意味にはならない。","focusJa":"状態動詞"},{"id":"grammar-present-simple-continuous-q4","type":"meaning","scenarioJa":"留学の滞在先について聞く。","prompt":"What does “I am staying with a host family this month” emphasize?","choices":[{"text":"A finished visit last year.","feedbackJa":"this monthの一時的な滞在です。"},{"text":"A rule for every student.","feedbackJa":"本人の状況を述べています。"},{"text":"A temporary living arrangement.","feedbackJa":"今月の一時的な滞在を示します。"},{"text":"An inability to find any accommodation.","feedbackJa":"泊まる場所がないとは述べていません。"}],"correctIndex":2,"explanationJa":"進行形とthis monthにより、現在の一時的な滞在として描いている。","focusJa":"一時的な状況"},{"id":"grammar-present-simple-continuous-q5","type":"intent","scenarioJa":"結論はまだ出さず、案を検討中だと伝える。","prompt":"Which sentence expresses that intention?","choices":[{"text":"I think your plan is excellent.","feedbackJa":"案に対する意見を述べています。"},{"text":"I am thinking about your plan.","feedbackJa":"案を検討している活動です。"},{"text":"I thought about your plan yesterday.","feedbackJa":"昨日考えたという過去の報告です。"},{"text":"I never think about your plan.","feedbackJa":"検討しないという意味です。"}],"correctIndex":1,"explanationJa":"think aboutを進行形にすると「検討している」。I think＋節は意見を述べる用法。","focusJa":"動詞の意味と形"},{"id":"grammar-present-simple-continuous-q6","type":"meaning","scenarioJa":"作文で二つの文を比べる。","prompt":"“I live in Osaka” and “I am living in Osaka this summer”: which comment is accurate?","choices":[{"text":"Only the first can ever be grammatical.","feedbackJa":"一時的な住まいを進行形で言えます。"},{"text":"The second must describe a past summer.","feedbackJa":"現在の夏の状況にも使えます。"},{"text":"The first says the speaker will never move.","feedbackJa":"永住を保証する表現ではありません。"},{"text":"Both can be natural; the second presents the situation as temporary.","feedbackJa":"どちらも自然で、捉え方が異なります。"}],"correctIndex":3,"explanationJa":"現在形は永久という意味ではない。進行形は期間を区切った一時的な状況を前に出せる。","focusJa":"自然な別表現の理解"}],"domainIds":["education","science","daily-life"],"sourceReferences":[{"title":"British Council: Present continuous","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference/present-continuous"},{"title":"British Council: Stative verbs","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/stative-verbs"}],"contentSha256":"5019853bb5a4cf7156b18739edec6bc98ce41fc728e0e533cd50ededbe511d2c","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_library_integration","reviewedAt":"2026-10-23T14:12:03.794Z","contentSha256":"5019853bb5a4cf7156b18739edec6bc98ce41fc728e0e533cd50ededbe511d2c"},"audio":{"status":"not-generated"}},{"id":"grammar-past-simple-continuous","series":"grammar","titleJa":"過去の出来事に、背景と順序をつける","levelTargets":["A2","B1","B2"],"goalJa":"読解で「その時すでにしていたこと」と「そこで起きたこと」を区別する。","conceptJa":"過去形は出来事を一つのまとまりとして述べ、過去進行形は過去の時点で動作の途中に視点を置く。両者を組み合わせると場面が立体的になる。","commonTrapJa":"whenの後は必ず過去形、whileの後は必ず進行形、と機械的に決めない。出来事の関係を読む。","usageNotes":["過去進行形は、その後に作業が完了したかどうかまでは述べない。","過去形でも長い活動を表せる。短い動作と長い動作だけの区別ではない。","物語の時系列を説明する時は、始まる・到着するなどの出来事と、その背景を分ける。"],"examples":[{"id":"grammar-past-simple-continuous-ex1","text":"I was reading a map when the bus arrived.","meaningJa":"地図を読んでいるとバスが到着しました。","contextJa":"到着前から読んでいた。"},{"id":"grammar-past-simple-continuous-ex2","text":"When the bus arrived, I closed the map.","meaningJa":"バスが到着した時、地図を閉じました。","contextJa":"到着を受けて次の行動をした。"},{"id":"grammar-past-simple-continuous-ex3","text":"At nine last night, we were discussing the survey results.","meaningJa":"昨夜9時には調査結果を話し合っていました。","contextJa":"過去の特定時刻の途中の場面。"},{"id":"grammar-past-simple-continuous-ex4","text":"We discussed the results for an hour and then went home.","meaningJa":"1時間結果を話し合ってから帰りました。","contextJa":"活動をまとまりとして振り返る。"}],"contrasts":[{"leftEnglish":"When I entered, Aya was opening the window.","rightEnglish":"When I entered, Aya opened the window.","noteJa":"左は入室時すでに開ける動作の途中、右は入室時に開けた出来事として述べる。"},{"leftEnglish":"I wrote the report last night.","rightEnglish":"I was writing the report at ten.","noteJa":"左は過去の作業をまとまりとして、右は10時の途中の様子を描く。右だけでは完成は分からない。"}],"questions":[{"id":"grammar-past-simple-continuous-q1","type":"context","scenarioJa":"電話が鳴った時点で、実験の後片付けの最中だった。","prompt":"We ___ the equipment when the phone rang.","choices":[{"text":"were cleaning","feedbackJa":"電話が鳴る前からの活動を表します。"},{"text":"have cleaning","feedbackJa":"この形は作れません。"},{"text":"are cleaned","feedbackJa":"現在の受け身になってしまいます。"},{"text":"will clean","feedbackJa":"未来の活動です。"}],"correctIndex":0,"explanationJa":"背景の継続中の活動はwere cleaning、そこで起きた出来事はrang。","focusJa":"背景と出来事"},{"id":"grammar-past-simple-continuous-q2","type":"meaning","scenarioJa":"旅行記の一文を読む。","prompt":"“I was buying a ticket when Mia arrived.” What was already in progress?","choices":[{"text":"Mia’s departure.","feedbackJa":"出発については書かれていません。"},{"text":"A future reservation.","feedbackJa":"過去の場面です。"},{"text":"The speaker’s ticket purchase.","feedbackJa":"到着時には購入中でした。"},{"text":"The completion of the journey.","feedbackJa":"旅行の完了は述べていません。"}],"correctIndex":2,"explanationJa":"was buyingにより、Miaの到着時に購入行為がすでに進行中と分かる。","focusJa":"時系列の読解"},{"id":"grammar-past-simple-continuous-q3","type":"context","scenarioJa":"昨日行ったかどうかを質問する。","prompt":"___ you visit the museum yesterday?","choices":[{"text":"Were","feedbackJa":"visitの原形とはこの形で使いません。"},{"text":"Did","feedbackJa":"過去の疑問文はDid＋主語＋原形です。"},{"text":"Have","feedbackJa":"yesterdayを特定した過去には合いません。"},{"text":"Was","feedbackJa":"youとwasの組み合わせでもありません。"}],"correctIndex":1,"explanationJa":"Didの後はvisitedではなくvisit。","focusJa":"過去の疑問文"},{"id":"grammar-past-simple-continuous-q4","type":"context","scenarioJa":"参加しなかったことを普通の過去形で述べる。","prompt":"I ___ the online session yesterday.","choices":[{"text":"did not joined","feedbackJa":"didの後は原形です。"},{"text":"was not join","feedbackJa":"wasと原形では作れません。"},{"text":"not joined","feedbackJa":"否定文を作る助動詞がありません。"},{"text":"did not join","feedbackJa":"did notの後を原形にします。"}],"correctIndex":3,"explanationJa":"過去の否定はdid not＋原形。","focusJa":"過去の否定文"},{"id":"grammar-past-simple-continuous-q5","type":"intent","scenarioJa":"説明の途中だったと伝え、説明が終わったかは述べない。","prompt":"Which sentence clearly presents the activity in progress?","choices":[{"text":"I was explaining the route when the screen went dark.","feedbackJa":"暗転時点で説明の途中だったと表せます。"},{"text":"I finished explaining the route before the screen went dark.","feedbackJa":"暗転前の完了を明示しています。"},{"text":"I will explain the route after lunch.","feedbackJa":"未来の予定です。"},{"text":"I never explained the route.","feedbackJa":"説明しなかったという意味です。"}],"correctIndex":0,"explanationJa":"進行形は途中に焦点を置く。完了・未完了の最終結果は別の情報が必要。","focusJa":"進行と完了の区別"},{"id":"grammar-past-simple-continuous-q6","type":"meaning","scenarioJa":"長時間だから必ず進行形、と考えていないか確認する。","prompt":"Which comment about “We waited for two hours and then left” is accurate?","choices":[{"text":"It is wrong because two hours is a long time.","feedbackJa":"過去形で長い活動も表せます。"},{"text":"It says the waiting continues now.","feedbackJa":"過去のまとまりを述べています。"},{"text":"It presents a completed period of waiting in a past sequence.","feedbackJa":"待って、その後去ったという順序です。"},{"text":"It describes a plan for tomorrow.","feedbackJa":"未来ではありません。"}],"correctIndex":2,"explanationJa":"過去形は短い動作専用ではない。2時間の待機を終わったまとまりとして描ける。","focusJa":"時間の長さと相の違い"}],"domainIds":["education","travel","science"],"sourceReferences":[{"title":"British Council: Past continuous and past simple","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2/past-continuous-past-simple"}],"contentSha256":"737ac8c24d15cae52dd2169818196688d2973169d9a4e678560f8e04a41a64aa","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_library_integration","reviewedAt":"2026-10-23T14:12:03.794Z","contentSha256":"737ac8c24d15cae52dd2169818196688d2973169d9a4e678560f8e04a41a64aa"},"audio":{"status":"not-generated"}},{"id":"grammar-present-perfect-past","series":"grammar","titleJa":"過去の話をするか、今につなげるか","levelTargets":["A2","B1","B2"],"goalJa":"経験・継続・現在の結果を読み分け、日時を指定する過去の報告と使い分ける。","conceptJa":"現在完了はhave/has＋過去分詞で、過去を今につながる範囲で見る。過去形は終わった過去の時点・期間の出来事として話す。","commonTrapJa":"「経験ならいつでも現在完了」ではない。last yearなど終わった時を指定した文は通常過去形。","usageNotes":["todayでも一日の活動を終わったものとして話すことがあり、時間表現だけで機械的に決めない。","justやalreadyと過去形を使う用法も、特に米語で自然。自然な地域差を誤答にしない。","have been toは行った経験、have gone toは行って今ここにいない意味になることがある。"],"examples":[{"id":"grammar-present-perfect-past-ex1","text":"I have visited two science museums this year.","meaningJa":"今年はこれまでに科学博物館を二つ訪れました。","contextJa":"まだ続く今年の経験を数える。"},{"id":"grammar-present-perfect-past-ex2","text":"I visited the city museum last Saturday.","meaningJa":"先週の土曜日、市立博物館を訪れました。","contextJa":"終わった日時を指定する。"},{"id":"grammar-present-perfect-past-ex3","text":"I have known my debate partner since April.","meaningJa":"4月からディベートの相手を知っています。","contextJa":"過去から今まで続く状態。"},{"id":"grammar-present-perfect-past-ex4","text":"I have lost my student card, so I cannot enter the library.","meaningJa":"学生証をなくしたので、図書館に入れません。","contextJa":"現在の困り事につながる結果。"}],"contrasts":[{"leftEnglish":"I lived near the sea for three years.","rightEnglish":"I have lived near the sea for three years.","noteJa":"左は終わった居住期間として、右は通常、今まで続く3年間として述べる。"},{"leftEnglish":"Have you ever joined a debate?","rightEnglish":"Did you join the debate last Friday?","noteJa":"左は今までの経験、右は特定の過去の行事について尋ねる。"}],"questions":[{"id":"grammar-present-perfect-past-q1","type":"context","scenarioJa":"昨日の提出について、日時をはっきり指定する。","prompt":"I ___ my application yesterday afternoon.","choices":[{"text":"have submitted","feedbackJa":"通常、終わった日時yesterdayとは使いません。"},{"text":"am submitting","feedbackJa":"現在の途中になってしまいます。"},{"text":"submitted","feedbackJa":"指定された過去の出来事に合います。"},{"text":"have submit","feedbackJa":"haveの後の形が誤りです。"}],"correctIndex":2,"explanationJa":"yesterday afternoonという終わった過去の日時にはsubmitted。","focusJa":"過去の日時"},{"id":"grammar-present-perfect-past-q2","type":"context","scenarioJa":"4月から今まで知り合いである。","prompt":"We ___ each other since April.","choices":[{"text":"have known","feedbackJa":"過去から今までの状態を示します。"},{"text":"know since","feedbackJa":"sinceが重複し、時制も合いません。"},{"text":"are knowing","feedbackJa":"knowの通常の状態用法には合いません。"},{"text":"have knew","feedbackJa":"knowの過去分詞はknownです。"}],"correctIndex":0,"explanationJa":"継続する状態はhave known。sinceは開始点を示す。","focusJa":"継続と過去分詞"},{"id":"grammar-present-perfect-past-q3","type":"meaning","scenarioJa":"会員カードを持っていない理由を説明する。","prompt":"“I have lost my card, so I cannot get in.” What is emphasized?","choices":[{"text":"The exact minute when the card disappeared.","feedbackJa":"紛失時刻は示されていません。"},{"text":"A card the speaker plans to buy.","feedbackJa":"購入予定の話ではありません。"},{"text":"A completed visit with no present connection.","feedbackJa":"今入れないことにつながっています。"},{"text":"A past event with a consequence now.","feedbackJa":"紛失の現在の結果です。"}],"correctIndex":3,"explanationJa":"現在完了が、今カードを使えない状況につながっている。","focusJa":"現在の結果"},{"id":"grammar-present-perfect-past-q4","type":"context","scenarioJa":"疑問文を正しい形で作る。","prompt":"Have you ever ___ a school newspaper article?","choices":[{"text":"wrote","feedbackJa":"これは過去形です。"},{"text":"written","feedbackJa":"haveの後に過去分詞を置きます。"},{"text":"writing","feedbackJa":"この完了形には合いません。"},{"text":"write","feedbackJa":"原形では完了形になりません。"}],"correctIndex":1,"explanationJa":"write–wrote–written。経験を尋ねるHave you ever＋過去分詞。","focusJa":"経験の質問"},{"id":"grammar-present-perfect-past-q5","type":"meaning","scenarioJa":"英作文の自然な言い方を学ぶ。","prompt":"Which comment about “I just sent it” and “I have just sent it” is accurate?","choices":[{"text":"The first is never used by fluent speakers.","feedbackJa":"特に米語で自然に使われます。"},{"text":"The second can only describe last year.","feedbackJa":"直近の完了にも使えます。"},{"text":"Both can be natural; region and conversational viewpoint affect the choice.","feedbackJa":"地域や話し方により両方ありえます。"},{"text":"They always mean the message has not been sent.","feedbackJa":"いずれも送信したことを述べます。"}],"correctIndex":2,"explanationJa":"justだけで一方を常に誤りとはしない。場面と英語の変種も考える。","focusJa":"地域差と自然な選択"},{"id":"grammar-present-perfect-past-q6","type":"meaning","scenarioJa":"先生がまだ戻っていない状況で読む。","prompt":"“Ms. Chen has gone to the laboratory.” Which reading fits this situation?","choices":[{"text":"She went there and is still away from here.","feedbackJa":"行って、まだここに戻っていない読みです。"},{"text":"She has never visited it.","feedbackJa":"訪問経験がない意味ではありません。"},{"text":"She works there every Friday only.","feedbackJa":"習慣の頻度は述べていません。"},{"text":"She has returned and is standing here.","feedbackJa":"指定された状況とは合いません。"}],"correctIndex":0,"explanationJa":"この状況のhas goneは「行って今ここにいない」。has been toなら訪問経験を表せる。","focusJa":"beenとgone"}],"domainIds":["education","travel","daily-life"],"sourceReferences":[{"title":"British Council: Present perfect","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/present-perfect"},{"title":"British Council: Talking about the past","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference/talking-about-past"},{"title":"Cambridge Dictionary: Present perfect or past simple?","url":"https://dictionaryblog.cambridge.org/2014/04/09/present-perfect-or-past-simple/"},{"title":"Cambridge English Grammar Today: Been or gone?","url":"https://dictionary.cambridge.org/us/grammar/british-grammar/been-or-gone"}],"contentSha256":"9cbec939343ef6002bf5928ca27d4200aac38b5e01660054dea5b28a1e5dd565","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_library_integration","reviewedAt":"2026-10-23T14:12:03.794Z","contentSha256":"9cbec939343ef6002bf5928ca27d4200aac38b5e01660054dea5b28a1e5dd565"},"audio":{"status":"not-generated"}},{"id":"grammar-present-perfect-continuous","series":"grammar","titleJa":"成果の数と、取り組んできた時間","levelTargets":["B1","B2"],"goalJa":"現在完了の単純形と進行形で、成果・活動・最近の跡を読み分ける。","conceptJa":"have doneは結果や完成した量を、have been doingは活動や続けてきた時間を前に出しやすい。進行形でも、話す直前に活動が止まっている場合がある。","commonTrapJa":"現在完了進行形なら必ず今も動作中、とは限らない。また数字があれば進行形は絶対不可という規則でもない。","usageNotes":["I have been writing three essaysも、三つの文章に取り組んでいて未完成という文脈なら可能。","knowなどの状態は通常have knownで表し、have been knowingにはしない。","have lived / have been livingのように両方使え、進行形が活動や一時性を強める例がある。"],"examples":[{"id":"grammar-present-perfect-continuous-ex1","text":"I have completed three practice essays.","meaningJa":"練習作文を3本完成させました。","contextJa":"完成した数を報告する。"},{"id":"grammar-present-perfect-continuous-ex2","text":"I have been working on an essay since breakfast.","meaningJa":"朝食後から作文に取り組んでいます。","contextJa":"活動の継続に焦点を当てる。"},{"id":"grammar-present-perfect-continuous-ex3","text":"Your hands are muddy. Have you been planting trees?","meaningJa":"手が泥だらけだね。植樹をしていたの？","contextJa":"最近の活動の跡から尋ねる。"},{"id":"grammar-present-perfect-continuous-ex4","text":"We have been reading the same novel in class this month.","meaningJa":"今月、授業で同じ小説を読んでいます。","contextJa":"最近繰り返している活動。"}],"contrasts":[{"leftEnglish":"I have read the whole article.","rightEnglish":"I have been reading the article.","noteJa":"左は全文を読み終えた結果、右は読んでいる活動。右だけでは読了は確定しない。"},{"leftEnglish":"She has lived here for five years.","rightEnglish":"She has been living here for five years.","noteJa":"どちらも今までの居住を表せる。常に片方だけが正解ではない。"}],"questions":[{"id":"grammar-present-perfect-continuous-q1","type":"intent","scenarioJa":"完成した作文の本数を明確に伝える。","prompt":"Which sentence explicitly reports three finished essays?","choices":[{"text":"I have been planning three essays.","feedbackJa":"計画への取り組みで、完成は示しません。"},{"text":"I will write three essays.","feedbackJa":"未来の話です。"},{"text":"I am starting three essays.","feedbackJa":"書き始める段階です。"},{"text":"I have completed three essays.","feedbackJa":"3本の完成を明示しています。"}],"correctIndex":3,"explanationJa":"completedという語と完了形で成果を明示する。","focusJa":"成果の量"},{"id":"grammar-present-perfect-continuous-q2","type":"context","scenarioJa":"昼から今まで繰り返し練習している。","prompt":"She has been ___ her speech since noon.","choices":[{"text":"practise","feedbackJa":"beenの後には-ing形が必要です。"},{"text":"practising","feedbackJa":"have been＋-ingの形です。"},{"text":"practised","feedbackJa":"この形では活動の進行になりません。"},{"text":"practises","feedbackJa":"三単現ではこの形を作れません。"}],"correctIndex":1,"explanationJa":"現在完了進行形はhas been practising。米綴りpracticingも同じ意味。","focusJa":"進行形の組み立て"},{"id":"grammar-present-perfect-continuous-q3","type":"meaning","scenarioJa":"走り終えて息が上がっている人が話す。","prompt":"“I have been running.” Does the speaker have to be running at this exact moment?","choices":[{"text":"Yes; the form always requires movement while speaking.","feedbackJa":"直前に終わった活動にも使えます。"},{"text":"Yes; otherwise only future forms are possible.","feedbackJa":"そのような制約はありません。"},{"text":"No; a recent activity can have a visible effect now.","feedbackJa":"活動の現在の跡を述べる場合があります。"},{"text":"No; it always means a habit that ended years ago.","feedbackJa":"遠い過去に終わった習慣とは限りません。"}],"correctIndex":2,"explanationJa":"現在完了進行形は最近の活動と現在の状態を結び付けることがある。","focusJa":"最近の活動の結果"},{"id":"grammar-present-perfect-continuous-q4","type":"context","scenarioJa":"相手を数年間知っている状態を伝える。","prompt":"I ___ our exchange student for several years.","choices":[{"text":"have known","feedbackJa":"knowの状態の継続に合います。"},{"text":"have been knowing","feedbackJa":"knowは通常この進行形にしません。"},{"text":"have knowing","feedbackJa":"完了形の構造が誤りです。"},{"text":"am know","feedbackJa":"beとknowの原形は使いません。"}],"correctIndex":0,"explanationJa":"動作の継続と状態の継続を区別し、状態動詞knowではhave knownを選ぶ。","focusJa":"状態の継続"},{"id":"grammar-present-perfect-continuous-q5","type":"meaning","scenarioJa":"二つの原稿を行き来して書いているが、どちらも未完成。","prompt":"Is “I have been writing two articles” possible in this context?","choices":[{"text":"No; all numbers ban the continuous.","feedbackJa":"数字だけで不可とは決まりません。"},{"text":"No; writing can never be continuous.","feedbackJa":"書く活動を進行形で表せます。"},{"text":"Yes; it necessarily says both articles are finished.","feedbackJa":"完成は保証しません。"},{"text":"Yes; it can describe ongoing work on the two articles.","feedbackJa":"二つに取り組んでいる活動として自然です。"}],"correctIndex":3,"explanationJa":"「何本完成したか」と「どの文章に取り組んでいたか」は別。文脈により二つの原稿を進行形で表せる。","focusJa":"数と文脈"},{"id":"grammar-present-perfect-continuous-q6","type":"meaning","scenarioJa":"返却期限を確認する場面。","prompt":"“I have been reading the book.” What does this sentence alone NOT establish?","choices":[{"text":"The speaker has spent time reading it.","feedbackJa":"読んでいた活動は示しています。"},{"text":"The speaker has finished the whole book.","feedbackJa":"全文を読了したとは確定しません。"},{"text":"The activity has a connection to the present.","feedbackJa":"現在までの活動として捉えています。"},{"text":"The activity began before this moment.","feedbackJa":"今より前からの活動です。"}],"correctIndex":1,"explanationJa":"読了を保証しないことに注意。読み続けているか、直前に止めたかは文脈による。","focusJa":"文から分かる範囲"}],"domainIds":["education","environment","sports"],"sourceReferences":[{"title":"British Council: Present perfect simple and continuous","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/present-perfect-simple-continuous"}],"contentSha256":"285efca0d5c13e930722fe6c1edd718d556b827df96204bf162a6a1f7b04ea92","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_library_integration","reviewedAt":"2026-10-23T14:12:03.794Z","contentSha256":"285efca0d5c13e930722fe6c1edd718d556b827df96204bf162a6a1f7b04ea92"},"audio":{"status":"not-generated"}},{"id":"grammar-future-forms","series":"grammar","titleJa":"予定・その場の決定・予測を伝える","levelTargets":["A2","B1","B2"],"goalJa":"未来表現が伝える意図を読み分け、作文で予定や予測の根拠を示す。","conceptJa":"willはその場の決定や予測、be going toは以前からの意図や今ある根拠からの予測、現在進行形は具体的な取り決めに使いやすい。意味の重なる場面も多い。","commonTrapJa":"未来の予定なら必ず一つの形しか使えない、とは考えない。形だけでなく、何を強調したいかを読む。","usageNotes":["同じ面会をI am going to meetとI am meetingで表せる場合がある。意図と取り決めは両立する。","willとgoing toの予測にも重なりがある。文脈なしで一方を不自然と決めない。","未来を表す現在進行形には、明日などの時間表現や共有された予定の文脈が手掛かりになる。"],"examples":[{"id":"grammar-future-forms-ex1","text":"I cannot carry all these books. I will bring a bag.","meaningJa":"この本を全部は運べない。袋を持ってくるよ。","contextJa":"問題に気づいて今決める。"},{"id":"grammar-future-forms-ex2","text":"I am going to revise my essay after dinner.","meaningJa":"夕食後に作文を見直すつもりです。","contextJa":"前から考えている計画。"},{"id":"grammar-future-forms-ex3","text":"We are meeting our tutor at four tomorrow.","meaningJa":"明日の4時に先生と面談します。","contextJa":"時刻を決めた予定。"},{"id":"grammar-future-forms-ex4","text":"Look at that loose shelf. It is going to fall.","meaningJa":"あのぐらついた棚を見て。落ちそうだ。","contextJa":"目の前の状況から予測する。"}],"contrasts":[{"leftEnglish":"I will help you with the posters.","rightEnglish":"I am going to help with the posters.","noteJa":"左はその場の申し出にも、右は既にある意図にも使える。文脈によっては両方自然。"},{"leftEnglish":"We are visiting the museum tomorrow.","rightEnglish":"We are visiting the museum now.","noteJa":"形は同じでも、tomorrowなら未来の予定、nowなら今の活動として読める。"}],"questions":[{"id":"grammar-future-forms-q1","type":"intent","scenarioJa":"相手に、時刻まで合意済みの面談を現在進行形で伝える。","prompt":"Which sentence does this?","choices":[{"text":"We met our tutor yesterday.","feedbackJa":"過去の出来事です。"},{"text":"We are meeting our tutor at four tomorrow.","feedbackJa":"現在進行形と未来の時刻で取り決めを示します。"},{"text":"We have never met our tutor.","feedbackJa":"会った経験について述べています。"},{"text":"We might meet a tutor one day.","feedbackJa":"不確かな将来の可能性です。"}],"correctIndex":1,"explanationJa":"are meetingは、ここでは明日4時という具体的な予定を表す。","focusJa":"取り決めと時間の手掛かり"},{"id":"grammar-future-forms-q2","type":"context","scenarioJa":"以前決めた放課後の計画をbe going toで書く。","prompt":"I am going to ___ my application after school.","choices":[{"text":"submitted","feedbackJa":"toの後には原形を置きます。"},{"text":"submitting","feedbackJa":"going to＋原形の形ではありません。"},{"text":"submits","feedbackJa":"三単現の形は使いません。"},{"text":"submit","feedbackJa":"be going to＋原形になります。"}],"correctIndex":3,"explanationJa":"be going toの後ろは動詞の原形submit。","focusJa":"未来表現の形"},{"id":"grammar-future-forms-q3","type":"meaning","scenarioJa":"本を落としそうな友人を見て、その場で申し出る。","prompt":"“I will take the heavy ones.” What is the speaker doing?","choices":[{"text":"Offering help in response to the situation.","feedbackJa":"今の状況に応じて助けを申し出ています。"},{"text":"Reporting a task completed yesterday.","feedbackJa":"過去の完了の報告ではありません。"},{"text":"Asking whether help is forbidden.","feedbackJa":"禁止かどうかを尋ねていません。"},{"text":"Describing a repeated childhood habit.","feedbackJa":"子どもの頃の習慣ではありません。"}],"correctIndex":0,"explanationJa":"このwillは状況への応答としての意志・申し出を表す。","focusJa":"その場の意志"},{"id":"grammar-future-forms-q4","type":"meaning","scenarioJa":"強い風で看板が揺れている。","prompt":"“That sign is going to fall.” What supports this prediction in the situation?","choices":[{"text":"A fall that happened last winter.","feedbackJa":"そのような過去の情報はありません。"},{"text":"A confirmed appointment with the sign.","feedbackJa":"取り決めの話ではありません。"},{"text":"Visible evidence that the sign is unstable.","feedbackJa":"今見えている不安定さが根拠です。"},{"text":"A rule that every sign falls at noon.","feedbackJa":"そのような一般規則はありません。"}],"correctIndex":2,"explanationJa":"going toは、目の前の根拠に基づく予測に使える。willによる予測が常に不可という意味ではない。","focusJa":"根拠のある予測"},{"id":"grammar-future-forms-q5","type":"usage","scenarioJa":"友人と明日の待ち合わせを決め、行くつもりでもある。","prompt":"Which comment is accurate?","choices":[{"text":"A future arrangement can never be expressed with the present continuous.","feedbackJa":"取り決めに現在進行形を使えます。"},{"text":"“I am meeting her” and “I am going to meet her” can both fit, with different emphasis.","feedbackJa":"取り決めと意図の両方がある状況です。"},{"text":"“I am meeting her” must refer to yesterday.","feedbackJa":"昨日を表す形ではありません。"},{"text":"“I am going to meet her” proves that no arrangement exists.","feedbackJa":"going toは取り決めがないことまでは示しません。"}],"correctIndex":1,"explanationJa":"意図と取り決めは両立する。未来表現の使い分けを絶対的な禁止規則にしない。","focusJa":"自然な表現の重なり"},{"id":"grammar-future-forms-q6","type":"context","scenarioJa":"willを使って将来の効果を予測する。","prompt":"This practice will ___ me explain my ideas more clearly.","choices":[{"text":"helps","feedbackJa":"willの後には原形です。"},{"text":"helped","feedbackJa":"過去形は置きません。"},{"text":"to help","feedbackJa":"willの直後にtoは置きません。"},{"text":"help","feedbackJa":"助動詞willの後は原形です。"}],"correctIndex":3,"explanationJa":"will help＋人＋原形で「人が〜するのに役立つだろう」。","focusJa":"willの後の原形"}],"domainIds":["education","communication","daily-life"],"sourceReferences":[{"title":"British Council: Future forms — will, be going to and present continuous","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/future-forms-will-be-going-present-continuous"},{"title":"British Council LearnEnglish Teens: Future forms","url":"https://learnenglishteens.britishcouncil.org/sites/teens/files/gs_future_forms_0.pdf"}],"contentSha256":"8feefa6e05f30122899cdd6ff479e125b42dbe9ca4cf8181becf781539a0aae5","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_library_integration","reviewedAt":"2026-10-23T14:12:03.794Z","contentSha256":"8feefa6e05f30122899cdd6ff479e125b42dbe9ca4cf8181becf781539a0aae5"},"audio":{"status":"not-generated"}},{"id":"grammar-zero-first-conditionals","series":"grammar","titleJa":"一般的な条件と、これからの条件","levelTargets":["A2","B1","B2"],"goalJa":"説明文の規則と、未来の具体的な条件を区別し、提案文に使う。","conceptJa":"ゼロ条件文はif/when＋現在形で一般的な関係を述べる。第一条件文は、実現しうる未来の条件に現在形を使い、結果をwillなどで述べる。","commonTrapJa":"未来の内容だからif節にも機械的にwillを入れない。ただしifの後のwillが全て誤りという規則ではない。","usageNotes":["条件の結果にはwill以外にcanや命令形も使える。条件文を一つの公式だけに限定しない。","whenは起きることを前提にする場面、ifは起きるかどうかを条件にする場面に合いやすい。","試験では文脈の時間軸を確認する。いつも成り立つ規則なのか、明日の一回なのかを読む。"],"examples":[{"id":"grammar-zero-first-conditionals-ex1","text":"If a member loses a library card, the school issues a replacement.","meaningJa":"会員が図書カードをなくした場合、学校は再発行します。","contextJa":"この学校の通常の規則。"},{"id":"grammar-zero-first-conditionals-ex2","text":"If the rain stops, we will hold the practice outside.","meaningJa":"雨がやんだら、外で練習します。","contextJa":"これからの具体的な条件。"},{"id":"grammar-zero-first-conditionals-ex3","text":"If you finish early, you can check your answers again.","meaningJa":"早く終わったら、もう一度答えを確認できます。","contextJa":"条件が満たされたときの選択肢。"},{"id":"grammar-zero-first-conditionals-ex4","text":"If you need another sheet, raise your hand.","meaningJa":"もう一枚用紙が必要なら、手を挙げてください。","contextJa":"条件付きの指示。"}],"contrasts":[{"leftEnglish":"If the door is open, this alarm sounds.","rightEnglish":"If the door is open tonight, the guard will check it.","noteJa":"左は装置の一般的な動作、右は今夜の条件と対応。"},{"leftEnglish":"If Maya arrives, we will begin.","rightEnglish":"When Maya arrives, we will begin.","noteJa":"ifは到着するかを条件として扱い、whenは到着を見込んでその時を示す。"}],"questions":[{"id":"grammar-zero-first-conditionals-q1","type":"context","scenarioJa":"明日、雨が降る可能性がある。普通の未来の条件として書く。","prompt":"If it ___ tomorrow, we will move the event indoors.","choices":[{"text":"rains","feedbackJa":"未来の条件でもif節は現在形です。"},{"text":"raining","feedbackJa":"主語の後の動詞が完成しません。"},{"text":"rain","feedbackJa":"itに合わせた現在形が必要です。"},{"text":"has rain","feedbackJa":"この文の動詞の形になりません。"}],"correctIndex":0,"explanationJa":"if it rainsが条件、we will moveがその結果。","focusJa":"未来のif節"},{"id":"grammar-zero-first-conditionals-q2","type":"meaning","scenarioJa":"機械の説明書に、通常の動作として書かれている。","prompt":"“If the battery becomes too hot, the device switches off.” What does this describe?","choices":[{"text":"A single event that definitely happened yesterday.","feedbackJa":"過去の一回を報告していません。"},{"text":"An impossible wish about a device.","feedbackJa":"非現実の願いではありません。"},{"text":"The device’s normal response to a condition.","feedbackJa":"条件に応じた通常の動作です。"},{"text":"A promise to buy a new battery.","feedbackJa":"購入の約束ではありません。"}],"correctIndex":2,"explanationJa":"一般的な条件と結果の関係を現在形で表している。","focusJa":"一般的な関係"},{"id":"grammar-zero-first-conditionals-q3","type":"context","scenarioJa":"必要な人に、追加資料の頼み方を指示する。","prompt":"If you need another copy, ___ the teacher.","choices":[{"text":"asking","feedbackJa":"この位置で指示の文になりません。"},{"text":"ask","feedbackJa":"命令形で条件付きの指示を作れます。"},{"text":"asked","feedbackJa":"過去形ではこの指示になりません。"},{"text":"asks","feedbackJa":"命令形には三単現のsを付けません。"}],"correctIndex":1,"explanationJa":"結果の節が命令形でもよい。条件文の結果が必ずwillになるわけではない。","focusJa":"条件付きの指示"},{"id":"grammar-zero-first-conditionals-q4","type":"intent","scenarioJa":"友人が来るかはまだ分からない。その到着を条件にしたい。","prompt":"Which wording makes the arrival an open condition?","choices":[{"text":"She arrived, so we began.","feedbackJa":"既に起きた到着と開始です。"},{"text":"We began before she arrived.","feedbackJa":"過去の順序の話です。"},{"text":"Whenever she arrives, we always begin.","feedbackJa":"繰り返される一般的なことになります。"},{"text":"If she arrives, we will begin.","feedbackJa":"到着するかを条件にしています。"}],"correctIndex":3,"explanationJa":"ifで実現するか未確定の条件を示す。whenなら到着を見込む言い方になりやすい。","focusJa":"ifの条件性"},{"id":"grammar-zero-first-conditionals-q5","type":"usage","scenarioJa":"早く課題を終えた人に、再確認してよいと伝える。","prompt":"Which sentence expresses that permission?","choices":[{"text":"If you finish early, you can check it again.","feedbackJa":"条件が満たされたときの許可を示します。"},{"text":"If you finish early, you must not check it again.","feedbackJa":"再確認を禁止しています。"},{"text":"If you finish early, you checked it yesterday.","feedbackJa":"未来の許可とは違う時間の話です。"},{"text":"If you finish early, checking again is impossible.","feedbackJa":"再確認が不可能だと言っています。"}],"correctIndex":0,"explanationJa":"canも条件の結果に使え、ここでは許可を表している。","focusJa":"will以外の結果"},{"id":"grammar-zero-first-conditionals-q6","type":"meaning","scenarioJa":"練習場所についての予定を読む。","prompt":"“If the wind gets stronger, we will practise indoors.” What does this sentence alone establish?","choices":[{"text":"The wind has already become stronger.","feedbackJa":"条件が実現したとは述べていません。"},{"text":"Indoor practice has already finished.","feedbackJa":"練習が終わった報告ではありません。"},{"text":"There is a plan for what to do if the condition occurs.","feedbackJa":"条件が起きた場合の計画です。"},{"text":"The wind can never become stronger.","feedbackJa":"その可能性を否定していません。"}],"correctIndex":2,"explanationJa":"条件文は対応を示しても、条件の実現を保証するわけではない。","focusJa":"条件と事実の区別"}],"domainIds":["education","technology","sports"],"sourceReferences":[{"title":"British Council: Conditionals — zero, first and second","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/conditionals-zero-first-second"}],"contentSha256":"7da528d95c1af68b6bcf643a3c26189a431378b32fda90f0aca754cc127cbc3d","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_library_integration","reviewedAt":"2026-10-23T14:12:03.794Z","contentSha256":"7da528d95c1af68b6bcf643a3c26189a431378b32fda90f0aca754cc127cbc3d"},"audio":{"status":"not-generated"}},{"id":"grammar-second-third-conditionals","series":"grammar","titleJa":"もし今〜なら・あの時〜していたら","levelTargets":["B1","B2","C1"],"goalJa":"仮定の時間軸を見抜き、意見・助言・過去の振り返りを表す。","conceptJa":"第二条件文はif＋過去形、would＋原形などで、現在・未来の想像を現実から距離を置いて述べる。第三条件文はif＋過去完了、would have＋過去分詞で、実際とは違う過去を想像する。","commonTrapJa":"if節が過去形でも、話題が過去とは限らない。条件の時点と結果の時点をそれぞれ確認する。","usageNotes":["仮定のbeにはwereが広く使われるが、I/he/sheなどでwasも用いられる。were以外を常に誤りとしない。","wouldだけでなくcouldやmightで、能力・可能性の違いを表せる。","過去の条件と現在の結果を組み合わせる混合条件文もある。時間軸が混在しているだけで誤りとは限らない。"],"examples":[{"id":"grammar-second-third-conditionals-ex1","text":"If our school had more space, we would grow vegetables.","meaningJa":"学校にもっと場所があれば、野菜を育てるのに。","contextJa":"今は十分な場所がないという想像。"},{"id":"grammar-second-third-conditionals-ex2","text":"If I were you, I would ask for another example.","meaningJa":"私があなたなら、もう一つ例を頼むと思う。","contextJa":"相手の立場を想像して助言する。"},{"id":"grammar-second-third-conditionals-ex3","text":"If we had left earlier, we would have caught the train.","meaningJa":"もっと早く出ていたら、その電車に間に合っただろう。","contextJa":"既に逃した電車を振り返る。"},{"id":"grammar-second-third-conditionals-ex4","text":"If I had saved the file, I would not be rewriting it now.","meaningJa":"ファイルを保存していたら、今書き直してはいないだろう。","contextJa":"過去の保存と今の結果を結ぶ。"}],"contrasts":[{"leftEnglish":"If I have time tomorrow, I will help.","rightEnglish":"If I had more time, I would help.","noteJa":"左は現実的な未来の条件、右は時間に余裕がない今を離れて想像する言い方。"},{"leftEnglish":"If she studied abroad, she would learn a lot.","rightEnglish":"If she had studied abroad, she would have learned a lot.","noteJa":"左は現在・未来の仮定として、右は実際とは異なる過去の留学として読める。"}],"questions":[{"id":"grammar-second-third-conditionals-q1","type":"context","scenarioJa":"今は練習用の部屋がない。部屋があれば、と想像する。","prompt":"If we ___ a practice room, we would rehearse after school.","choices":[{"text":"have had tomorrow","feedbackJa":"この空所で自然な条件を作れません。"},{"text":"will having","feedbackJa":"動詞の形が成立しません。"},{"text":"had","feedbackJa":"現在の非現実的な条件を過去形で表します。"},{"text":"having","feedbackJa":"if節の動詞が完成しません。"}],"correctIndex":2,"explanationJa":"hadはここでは過去の所有でなく、今の現実から距離を置く形。","focusJa":"第二条件文の時間"},{"id":"grammar-second-third-conditionals-q2","type":"meaning","scenarioJa":"昨日の遅刻を振り返る。実際には目覚ましを設定しなかった。","prompt":"“If I had set an alarm, I would have arrived on time.” What is being imagined?","choices":[{"text":"A different past with a different result.","feedbackJa":"過去の行動と結果を変えて想像しています。"},{"text":"An alarm that will certainly ring tomorrow.","feedbackJa":"明日の確定した予定ではありません。"},{"text":"A rule that applies to all clocks.","feedbackJa":"時計全般の規則ではありません。"},{"text":"A completed action that the speaker says actually happened.","feedbackJa":"設定しなかった事実に反する仮定です。"}],"correctIndex":0,"explanationJa":"had setとwould have arrivedが、実際とは違う過去を作る。","focusJa":"第三条件文の意味"},{"id":"grammar-second-third-conditionals-q3","type":"context","scenarioJa":"既に終わった大会で、練習不足があったことを振り返る。","prompt":"If we had practised more, we would have ___ more confident.","choices":[{"text":"be","feedbackJa":"haveの後には過去分詞です。"},{"text":"being","feedbackJa":"この完了形には合いません。"},{"text":"was","feedbackJa":"過去形ではなく過去分詞が必要です。"},{"text":"been","feedbackJa":"would have beenの形です。"}],"correctIndex":3,"explanationJa":"would have＋過去分詞で、過去にありえた結果を述べる。","focusJa":"仮定の過去の結果"},{"id":"grammar-second-third-conditionals-q4","type":"meaning","scenarioJa":"昨日バックアップを取らず、今困っている。","prompt":"“If I had backed up the file, I would not be worried now.” Which time relationship is expressed?","choices":[{"text":"A present condition and a completed future result.","feedbackJa":"条件は昨日の行動です。"},{"text":"A past condition and a present result.","feedbackJa":"過去の保存と今の心配を結び付けています。"},{"text":"Two unrelated habits.","feedbackJa":"一つの仮定と結果です。"},{"text":"A future condition and a past result.","feedbackJa":"時間の方向が逆です。"}],"correctIndex":1,"explanationJa":"had backed upは過去、would not be worried nowは現在。意味の通る混合条件文。","focusJa":"混合条件文"},{"id":"grammar-second-third-conditionals-q5","type":"usage","scenarioJa":"相手の立場になったつもりで助言する。","prompt":"Which sentence is a conventional way to give this advice?","choices":[{"text":"If I am you yesterday, I ask.","feedbackJa":"時制と状況の組み合わせが不自然です。"},{"text":"If I had you, I asking.","feedbackJa":"「あなたの立場なら」という意味にならず形も誤りです。"},{"text":"If I were you, I would ask the teacher.","feedbackJa":"相手の立場を想像する定番の助言です。"},{"text":"If I will you, I have asked.","feedbackJa":"動詞の形が成立しません。"}],"correctIndex":2,"explanationJa":"If I were youは助言に使いやすい表現。仮定のbeでwasが用いられる他の場面を全て否定するものではない。","focusJa":"仮定による助言"},{"id":"grammar-second-third-conditionals-q6","type":"meaning","scenarioJa":"先週、応募書類をもっと早く見つけていたら、と話す。","prompt":"“If I had seen the notice, I might have applied.” How strong is the claim about applying?","choices":[{"text":"Applying is s are being checked now.","meaningJa":"結果は今、確認されているところです。","contextJa":"進行中の確認。"},{"id":"grammar-passive-ex4","text":"The final report has been uploaded.","meaningJa":"最終報告書はアップロード済みです。","contextJa":"現在利用できる結果に焦点を置く。"}],"contrasts":[{"leftEnglish":"The students measured the temperature.","rightEnglish":"The temperature was measured by the students.","noteJa":"内容の中心を生徒から温度に移せる。どちらが適切かは前後の話題による。"},{"leftEnglish":"The document is being translated.","rightEnglish":"The document has been translated.","noteJa":"左は翻訳の進行中、右は翻訳が済んだ結果を表す。"}],"questions":[{"id":"grammar-passive-q1","type":"context","scenarioJa":"創立年を、学校を主語にして説明する。","prompt":"The school was ___ in 1968.","choices":[{"text":"establish","feedbackJa":"beの後に原形は置けません。"},{"text":"establishing","feedbackJa":"この学校が何かを創設中という形になり、文も完成しません。"},{"text":"establishes","feedbackJa":"三単現の形は使えません。"},{"text":"established","feedbackJa":"was＋過去分詞で受け身になります。"}],"correctIndex":3,"explanationJa":"was establishedは「設立された」。主語のschoolが行為を受ける。","focusJa":"受け身の基本形"},{"id":"grammar-passive-q2","type":"meaning","scenarioJa":"公開前の資料について読む。","prompt":"“The figures are being checked.” Which interpretation fits?","choices":[{"text":"The checking was permanently forbidden.","feedbackJa":"禁止は述べていません。"},{"text":"The checking is currently in progress.","feedbackJa":"確認されている途中です。"},{"text":"The figures are checking a person.","feedbackJa":"数字が行為者ではありません。"},{"text":"The checking is guaranteed never to begin.","feedbackJa":"むしろ進行中と述べています。"}],"correctIndex":1,"explanationJa":"are being＋過去分詞は進行中の受け身。","focusJa":"進行中の受け身"},{"id":"grammar-passive-q3","type":"intent","scenarioJa":"実験報告で、誰が測ったかより測定した温度を中心にする。","prompt":"Which sentence puts the temperature in subject position?","choices":[{"text":"We measured the temperature twice.","feedbackJa":"主語は測定した私たちです。"},{"text":"Our teacher asked us to measure it.","feedbackJa":"主語は先生です。"},{"text":"The temperature was measured twice.","feedbackJa":"測定対象を主語にしています。"},{"text":"Two students measured it together.","feedbackJ
