arioJa":"都市への到着と、その後の待ち合わせ地点への到着を説明します。","prompt":"We arrived ___ Kyoto in the morning and ___ the meeting point at noon.","choices":[{"text":"in / at","feedbackJa":"都市は in、待ち合わせ地点は at が合います。"},{"text":"to / to","feedbackJa":"arrive は go to と同じ形にしません。"},{"text":"on / in","feedbackJa":"この都市と地点の組合せには合いません。"},{"text":"for / by","feedbackJa":"到着先を示す形ではありません。"}],"correctIndex":0,"explanationJa":"arrive in + 都市、arrive at + 地点という基本形を使います。","focusJa":"arrive と場所の組合せ"},{"id":"prepositions-travel-institutions-q4","type":"usage","scenarioJa":"部活動が終わったので帰宅した、と標準的な英文で書きます。","prompt":"Which sentence is natural?","choices":[{"text":"I went to home after practice.","feedbackJa":"この副詞的な home の前には to を置きません。"},{"text":"I went at home after practice.","feedbackJa":"移動の go と at home の組合せでは合いません。"},{"text":"I went home after practice.","feedbackJa":"go home で帰宅することを表せます。"},{"text":"I went in home after practice.","feedbackJa":"この形では自然な帰宅の表現になりません。"}],"correctIndex":2,"explanationJa":"home は go home の形で直接続けられます。go to my house のような名詞句とは区別します。","focusJa":"前置詞を置かない go home"},{"id":"prepositions-travel-institutions-q5","type":"usage","scenarioJa":"学校で習った内容を話す英米の生徒の発言を比べます。","prompt":"Which statement about “I learned it at school” and “I learned it in school” is accurate?","choices":[{"text":"“In school” must mean the speaker is physically inside a wall.","feedbackJa":"学習や在学を表す使い方もあります。"},{"text":"Both can describe learning at school; variety and context affect the choice.","feedbackJa":"どちらも学習の場として使えます。"},{"text":"“At school” is always wrong in British English.","feedbackJa":"英国でも自然に使われます。"},{"text":"The expressions necessarily mean opposite things.","feedbackJa":"反対の意味とは限りません。"}],"correctIndex":1,"explanationJa":"自然な地域差を認めます。前置詞だけで建物内か屋外かを断定しません。","focusJa":"学校という活動と地域差"},{"id":"prepositions-travel-institutions-q6","type":"intent","scenarioJa":"父親の車の座席に座って帰宅しました。車の屋根には乗っていません。","prompt":"Which sentence describes that journey naturally?","choices":[{"text":"I went home on my father’s car.","feedbackJa":"通常は車の外側の上という読みになります。"},{"text":"I went home by my father’s car.","feedbackJa":"この特定の車を示す形では in が自然です。"},{"text":"I went home under my father’s car.","feedbackJa":"車の下という意味になります。"},{"text":"I went home in my father’s car.","feedbackJa":"特定の車の中に乗って帰る形です。"}],"correctIndex":3,"explanationJa":"by car は手段、in my father’s car は具体的な車に乗っていることを表します。","focusJa":"手段と具体的な乗り物を分ける"}],"domainIds":["education","travel","transport","daily-life"],"sourceReferences":[{"title":"Cambridge English Grammar Today: By","url":"https://dictionary.cambridge.org/grammar/british-grammar/by"},{"title":"Cambridge English Grammar Today: At, on and in (place)","url":"https://dictionary.cambridge.org/grammar/british-grammar/at-on-and-in-place"},{"title":"Cambridge Dictionary: school","url":"https://dictionary.cambridge.org/us/dictionary/english/school"},{"title":"Cambridge English Grammar Today: Word patterns: arrive somewhere","url":"https://dictionary.cambridge.org/grammar/british-grammar/word-patterns-arrive-somewhere"},{"title":"Cambridge English Grammar Today: Prepositions: home","url":"https://dictionary.cambridge.org/grammar/british-grammar/prepositions-home"}],"contentSha256":"82e20ffa9e83df6f81b5f2be7a9f2bf57ab7576df98d7f17b500ebbcd75145df","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"82e20ffa9e83df6f81b5f2be7a9f2bf57ab7576df98d7f17b500ebbcd75145df"},"audio":{"status":"not-generated"}},{"id":"verbs-get-change","series":"verbs","titleJa":"get：手に入る・わかる・状態が変わる","levelTargets":["B1","B2"],"goalJa":"長文や会話の get を目的語・形容詞から読み分け、変化を表す短い英文を書ける。","conceptJa":"get は後ろの形で意味が変わる。物なら受け取る・手に入れる、形容詞なら状態の変化、話の内容なら理解する、と文脈で判断する。","commonTrapJa":"get をすべて「得る」と訳さない。get tired は疲れた状態への変化で、be tired はその状態を述べる。","usageNotes":["get + 形容詞で変化を表す。比較級も使え、get better は改善を表せる。","会話の get it は説明や冗談を理解する意味になり、物を受け取る意味とは文脈で区別する。","改まった作文では意味に応じて receive、obtain、become、understand などに言い換えると具体的になる。get 自体を一律に誤りにはしない。"],"examples":[{"id":"verbs-get-change-ex1","text":"I got a reply from the exchange school this morning.","meaningJa":"今朝、交流先の学校から返事を受け取った。","contextJa":"留学の連絡"},{"id":"verbs-get-change-ex2","text":"The room got quieter when the discussion began.","meaningJa":"討論が始まると部屋は静かになった。","contextJa":"学校での変化"},{"id":"verbs-get-change-ex3","text":"I did not get the joke until my friend explained the final line.","meaningJa":"友達が最後の一文を説明するまで、その冗談がわからなかった。","contextJa":"会話の理解"},{"id":"verbs-get-change-ex4","text":"The air gets colder as we climb higher.","meaningJa":"高く登るにつれて空気が冷たくなる。","contextJa":"自然についての説明"}],"contrasts":[{"leftEnglish":"She is nervous.","rightEnglish":"She is getting nervous.","noteJa":"左は現在の状態、右は緊張が生じたり強まったりする変化。どちらも自然。"},{"leftEnglish":"I got your message.","rightEnglish":"I understood your message.","noteJa":"左は受信にも理解にもなりうる。理解を明示したいときは右が明確。"}],"questions":[{"id":"verbs-get-change-q1","type":"meaning","scenarioJa":"授業で、説明を聞き直した生徒の発言。","prompt":"“Now I get it.” の意味は？","choices":[{"text":"今はそれを理解できた。","feedbackJa":"説明の内容を理解したという意味。"},{"text":"今はそれを買える。","feedbackJa":"買う場面ではない。"},{"text":"今はそれを返送する。","feedbackJa":"get it に返送する意味はない。"},{"text":"今はそれを忘れた。","feedbackJa":"理解できたことと逆になる。"}],"correctIndex":0,"explanationJa":"説明を受けた直後の get it は understand it に近い。","focusJa":"文脈による多義語の判別"},{"id":"verbs-get-change-q2","type":"context","scenarioJa":"最初は難しかったが、練習で少しずつ簡単になる。","prompt":"With practice, the task is getting ___.","choices":[{"text":"easily","feedbackJa":"変化後の状態には副詞でなく形容詞を置く。"},{"text":"easier","feedbackJa":"より簡単な状態への変化を表す。"},{"text":"ease","feedbackJa":"この形では状態を表す形容詞が必要。"},{"text":"to easy","feedbackJa":"easy の前に to は置かない。"}],"correctIndex":1,"explanationJa":"get + 比較級で、程度が変わることを表せる。","focusJa":"get + 形容詞"},{"id":"verbs-get-change-q3","type":"intent","scenarioJa":"英作文で「協会から許可証を受け取った」と具体的に述べる。","prompt":"“I got a permit from the association.” の意味を保つ言い換えは？","choices":[{"text":"I cancelled a permit from the association.","feedbackJa":"許可証を取り消す意味に変わる。"},{"text":"I requested a permit from the association.","feedbackJa":"申請しただけでは受け取ったとは限らない。"},{"text":"I received a permit from the association.","feedbackJa":"受け取ったという結果を保つ。"},{"text":"I returned a permit to the association.","feedbackJa":"返した意味になる。"}],"correctIndex":2,"explanationJa":"この get は取得・受領。request はその前段階なので同じではない。","focusJa":"作文での具体的な言い換え"},{"id":"verbs-get-change-q4","type":"meaning","scenarioJa":"科学記事に “The water got warmer during the afternoon.” とある。","prompt":"本文から言えることは？","choices":[{"text":"水は一日中同じ温度だった。","feedbackJa":"warmer は温度の変化を示す。"},{"text":"水は必ず沸騰した。","feedbackJa":"暖かくなっただけで沸騰は言えない。"},{"text":"水を別の容器に移した。","feedbackJa":"容器の移動は述べていない。"},{"text":"午後の間に水温が上がった。","feedbackJa":"get warmer の変化を正しく表す。"}],"correctIndex":3,"explanationJa":"比較級 warmer は以前より温かいことを表し、絶対的な高温までは示さない。","focusJa":"比較と推論の限界"},{"id":"verbs-get-change-q5","type":"usage","scenarioJa":"「待っているうちにいらいらし始めた」と言いたい。","prompt":"その変化を直接表す文は？","choices":[{"text":"I got impatient while I was waiting.","feedbackJa":"待つ間にいらいらした状態になった。"},{"text":"I got an impatient while I was waiting.","feedbackJa":"impatient はこの形では名詞ではない。"},{"text":"I got impatiently while I was waiting.","feedbackJa":"状態の変化には形容詞 impatient を使う。"},{"text":"I got to impatient while I was waiting.","feedbackJa":"get + 形容詞に to は要らない。"}],"correctIndex":0,"explanationJa":"get impatient は「いらいらした状態になる」。","focusJa":"変化の表現を産出する"},{"id":"verbs-get-change-q6","type":"intent","scenarioJa":"友人は以前から疲れている。「疲れている」という状態だけを報告する。","prompt":"その意図に合う文は？","choices":[{"text":"She is getting tired.","feedbackJa":"疲れ始めるという変化に焦点を当てる。"},{"text":"She is tired.","feedbackJa":"現在の状態を直接述べる。"},{"text":"She got a new job.","feedbackJa":"仕事の取得の話になる。"},{"text":"She gets the question.","feedbackJa":"質問を理解する意味になる。"}],"correctIndex":1,"explanationJa":"be は状態、get は状態への変化。どちらが正しいかは伝えたい内容で決まる。","focusJa":"状態と変化の区別"}],"domainIds":["education","communication","science"],"sourceReferences":[{"title":"Cambridge English Grammar Today: Get","url":"https://dictionary.cambridge.org/us/grammar/british-grammar/get"}],"contentSha256":"2e4476e0fe71965b599202c52efc16b319bc0c78d8c23ce9b45ea8d8707cb7f9","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_pipeline_design","reviewedAt":"2026-10-23T14:10:48.471Z","contentSha256":"2e4476e0fe71965b599202c52efc16b319bc0c78d8c23ce9b45ea8d8707cb7f9"},"audio":{"status":"not-generated"}},{"id":"verbs-get-done","series":"verbs","titleJa":"get something done：実行者と完了を分ける","levelTargets":["B1","B2"],"goalJa":"修理の依頼と課題の完了を読み分け、get + 目的語 + 過去分詞を使える。","conceptJa":"get + 目的語 + 過去分詞は、その物・作業をある状態にする。修理店の文脈では人にしてもらう意味になり、get the work done は作業の完了に焦点を当てる。","commonTrapJa":"get something done だけで必ず有料の外注だと決めない。誰が実行したかは文脈で確認する。","usageNotes":["get my bike repaired の repaired は、自転車が修理されることを表す。","get a person to do では、実行する人の後ろに to + 動詞を置く。","改まった文では have something done も使える。get を使っただけで強制したとは限らない。"],"examples":[{"id":"verbs-get-done-ex1","text":"I got my bicycle repaired at a shop near the station.","meaningJa":"駅の近くの店で自転車を修理してもらった。","contextJa":"通学用の自転車"},{"id":"verbs-get-done-ex2","text":"We need to get the report finished before the school festival.","meaningJa":"文化祭までに報告書を完成させる必要がある。","contextJa":"共同課題の締め切り"},{"id":"verbs-get-done-ex3","text":"Mina got her brother to check the figures in her chart.","meaningJa":"ミナは兄にグラフの数値を確認してもらった。","contextJa":"発表の準備"},{"id":"verbs-get-done-ex4","text":"I got all the revision done on the train myself.","meaningJa":"電車の中で復習を全部自分で終わらせた。","contextJa":"自分で完了させる"}],"contrasts":[{"leftEnglish":"I repaired my bicycle.","rightEnglish":"I got my bicycle repaired at a shop.","noteJa":"左は自分が修理した。右は店で修理してもらう手配をした文脈。"},{"leftEnglish":"I got the essay checked.","rightEnglish":"I got my teacher to check the essay.","noteJa":"左は確認される文章、右は確認する先生を明示する。"}],"questions":[{"id":"verbs-get-done-q1","type":"context","scenarioJa":"修理店に画面の交換を依頼した。","prompt":"I got my phone screen ___ yesterday.","choices":[{"text":"replacing","feedbackJa":"画面自身が交換作業をする意味にはしない。"},{"text":"replace","feedbackJa":"この構文では原形を置かない。"},{"text":"replaced","feedbackJa":"画面が交換された結果を表す。"},{"text":"to replaced","feedbackJa":"to の後に過去分詞は置かない。"}],"correctIndex":2,"explanationJa":"get + 物 + 過去分詞で、その物への作業をしてもらう。","focusJa":"受ける側の目的語"},{"id":"verbs-get-done-q2","type":"meaning","scenarioJa":"作文に “I got the worksheet finished myself.” とある。","prompt":"最も適切な理解は？","choices":[{"text":"必ず誰かに代金を払った。","feedbackJa":"支払いは示していない。"},{"text":"先生が代わりに全部解いた。","feedbackJa":"myself と矛盾する。"},{"text":"まだ何も始めていない。","feedbackJa":"finished は完了を示す。"},{"text":"本人がワークシートを終わらせた。","feedbackJa":"myself が実行者を明確にする。"}],"correctIndex":3,"explanationJa":"get something finished は完了に焦点を当て、必ず他人にしてもらうとは限らない。","focusJa":"外注だと決めつけない"},{"id":"verbs-get-done-q3","type":"usage","scenarioJa":"友人に発音を確認してもらったことを、実行者を含めて書く。","prompt":"正しい形は？","choices":[{"text":"I got my friend to check my pronunciation.","feedbackJa":"人 + to + 動詞の形。"},{"text":"I got my friend check my pronunciation.","feedbackJa":"get 人 to do には to が必要。"},{"text":"I got my friend checked my pronunciation.","feedbackJa":"checked をこの位置で述語にはできない。"},{"text":"I got my friend to checked my pronunciation.","feedbackJa":"to の後は原形 check。"}],"correctIndex":0,"explanationJa":"get someone to do と get something done は目的語の役割が違う。","focusJa":"get 人 to do"},{"id":"verbs-get-done-q4","type":"intent","scenarioJa":"自分が修理したのではなく、専門店にカメラを修理してもらった。","prompt":"事実に合う報告は？","choices":[{"text":"I repaired the camera myself.","feedbackJa":"自分で修理したという別の事実。"},{"text":"I got the camera repaired at a specialist shop.","feedbackJa":"店に修理を依頼したことが伝わる。"},{"text":"I taught the camera repair course.","feedbackJa":"修理講座を教えた意味。"},{"text":"I decided not to repair the camera.","feedbackJa":"修理しない決定で、完了と違う。"}],"correctIndex":1,"explanationJa":"実行者を自分と誤解させず、手配した結果を述べる形。","focusJa":"依頼と実行の区別"},{"id":"verbs-get-done-q5","type":"meaning","scenarioJa":"班長が “Can we get the poster printed by Friday?” と相談した。","prompt":"求めていることは？","choices":[{"text":"金曜日に印刷方法を忘れること。","feedbackJa":"完了の依頼とは関係しない。"},{"text":"金曜日まで一切相談しないこと。","feedbackJa":"相談を延期する意味はない。"},{"text":"金曜日までにポスターの印刷を済ませること。","feedbackJa":"by は完了期限。"},{"text":"班長が自分で印刷すると確約すること。","feedbackJa":"この文だけでは実行者を指定しない。"}],"correctIndex":2,"explanationJa":"get the poster printed は印刷を済ませること。実行者は別途確認できる。","focusJa":"期限と実行者の読み取り"},{"id":"verbs-get-done-q6","type":"context","scenarioJa":"英作文を確認してくれた人を明示する。","prompt":"I got my tutor ___ the final paragraph.","choices":[{"text":"checked","feedbackJa":"人の後には to check を続ける。"},{"text":"checking to","feedbackJa":"この語順では check の目的語につながらない。"},{"text":"check","feedbackJa":"get では to を省かない。"},{"text":"to check","feedbackJa":"先生が確認する、という形になる。"}],"correctIndex":3,"explanationJa":"get my tutor to check は、先生に確認を頼んでしてもらう表現。","focusJa":"構文を見て補充する"}],"domainIds":["education","daily-life","technology"],"sourceReferences":[{"title":"Cambridge English Grammar Today: Get","url":"https://dictionary.cambridge.org/us/grammar/british-grammar/get"},{"title":"Cambridge Dictionary: Get — cause","url":"https://dictionary.cambridge.org/dictionary/english/get"}],"contentSha256":"d8e14085d144f3c5eb88137726d3e85b07d64f7f8eace3e26a4d75fbd1f8838b","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_pipeline_design","reviewedAt":"2026-10-23T14:10:48.471Z","contentSha256":"d8e14085d144f3c5eb88137726d3e85b07d64f7f8eace3e26a4d75fbd1f8838b"},"audio":{"status":"not-generated"}},{"id":"verbs-get-across","series":"verbs","titleJa":"get across：伝えた、から伝わった、へ","levelTargets":["B1","B2"],"goalJa":"要旨が伝わることと相手が同意することを区別し、説明・英作文で使える。","conceptJa":"get a point across は、要点を相手に伝わるように示すこと。単に言葉を発したことより、理解に届くことに焦点がある。","commonTrapJa":"get a point across を「必ず賛成させる」と読まない。理解した上で反対することもある。","usageNotes":["get the idea across と get across the idea はどちらも使える。代名詞なら get it across。","伝える相手は to + 人で示せる。","長文の比喩的な across と、道路などを横切る物理的な across は文脈で分ける。"],"examples":[{"id":"verbs-get-across-ex1","text":"A simple diagram helped me get the main idea across to the class.","meaningJa":"簡単な図のおかげで、主な考えをクラスに伝えられた。","contextJa":"授業の発表"},{"id":"verbs-get-across-ex2","text":"The writer gets her concern about food waste across through one family story.","meaningJa":"筆者はある家族の話を通して、食品ロスへの懸念を伝えている。","contextJa":"長文の筆者の意図"},{"id":"verbs-get-across-ex3","text":"I understand the point you are getting across, but I disagree with your solution.","meaningJa":"伝えようとしている要点はわかるが、解決策には反対だ。","contextJa":"討論での応答"},{"id":"verbs-get-across-ex4","text":"Could you use an example to get it across more clearly?","meaningJa":"もっと明確に伝わるよう、例を使ってもらえますか。","contextJa":"説明を頼む会話"}],"contrasts":[{"leftEnglish":"She repeated the message.","rightEnglish":"She got the message across.","noteJa":"繰り返しただけでは理解されたとは限らない。右は内容が届いたことに焦点。"},{"leftEnglish":"They understood my point.","rightEnglish":"They agreed with my point.","noteJa":"理解と同意は別。get across が成功しても反対意見は残りうる。"}],"questions":[{"id":"verbs-get-across-q1","type":"meaning","scenarioJa":"発表後に “I finally got my point across.” と言った。","prompt":"何ができたという意味？","choices":[{"text":"相手に要点を伝えられた。","feedbackJa":"伝達の成功を表す。"},{"text":"相手に絶対服従を約束させた。","feedbackJa":"服従までは意味しない。"},{"text":"発表を必ず延期した。","feedbackJa":"延期の表現ではない。"},{"text":"論点を完全に忘れた。","feedbackJa":"伝達の成功と逆。"}],"correctIndex":0,"explanationJa":"point は論点。get across はその論点を理解できる形で届ける。","focusJa":"句動詞の比喩的意味"},{"id":"verbs-get-across-q2","type":"usage","scenarioJa":"直前に述べた考えを it で受ける。","prompt":"「うまく伝えられなかった」の形は？","choices":[{"text":"I could not get across it clearly.","feedbackJa":"代名詞 it は get と across の間に置く。"},{"text":"I could not get it across clearly.","feedbackJa":"代名詞の位置が適切。"},{"text":"I could not get it to across clearly.","feedbackJa":"この句動詞に to は入れない。"},{"text":"I could not get across clearly it.","feedbackJa":"it を副詞の後ろに置かない。"}],"correctIndex":1,"explanationJa":"分離できる句動詞でも、短い目的語代名詞は動詞と particle の間に置く。","focusJa":"代名詞の語順"},{"id":"verbs-get-across-q3","type":"intent","scenarioJa":"小論文の読み手に、ごみの量の大きさを理解してもらいたい。","prompt":"その意図に最も合う文は？","choices":[{"text":"I want to put off explaining the problem until next month.","feedbackJa":"問題の説明を来月まで先延ばしにする意味になる。"},{"text":"I want to keep the scale of the problem secret.","feedbackJa":"問題を隠すという逆の意図。"},{"text":"I want to get the scale of the problem across to readers.","feedbackJa":"規模が伝わることを目指している。"},{"text":"I want to change the subject before explaining the problem.","feedbackJa":"説明前に話題を変えるという別の意図。"}],"correctIndex":2,"explanationJa":"get 内容 across to 読み手で、理解してほしい内容と相手を示せる。","focusJa":"読み手を意識した作文"},{"id":"verbs-get-across-q4","type":"meaning","scenarioJa":"相手が “You got your point across, but I still disagree.” と答えた。","prompt":"言えることは？","choices":[{"text":"説明が一語も聞こえなかった。","feedbackJa":"要点は伝わったと言っている。"},{"text":"提案が承認された。","feedbackJa":"disagree は反対を示す。"},{"text":"話し合いがまだ始まっていない。","feedbackJa":"既に説明を受けた後の応答。"},{"text":"理解されたが同意は得られなかった。","feedbackJa":"両方の節の意味を保つ。"}],"correctIndex":3,"explanationJa":"get across と agree は別の段階。接続詞 but の対比を読む。","focusJa":"理解と賛同を分ける"},{"id":"verbs-get-across-q5","type":"meaning","scenarioJa":"発表の報告に “She got her message across to the audience.” とある。","prompt":"この文で、内容を受け取って理解した相手は？","choices":[{"text":"発表を聞いていた聴衆。","feedbackJa":"to the audience が伝達先を示す。"},{"text":"その発表者自身だけ。","feedbackJa":"she は伝える側で、伝達先は別に示されている。"},{"text":"発表者に資料を渡した人。","feedbackJa":"資料を渡した人はこの文に登場しない。"},{"text":"発表を聞かずに会場を出た人。","feedbackJa":"伝達先の audience をそのように限定していない。"}],"correctIndex":0,"explanationJa":"get something across to someone の to 以下が内容の届いた相手を表す。","focusJa":"伝達する側と受け取る側"},{"id":"verbs-get-across-q6","type":"intent","scenarioJa":"「同じ説明を三回したが、要点はまだ伝わっていない」と述べたい。","prompt":"その状況に合う文は？","choices":[{"text":"I explained it three times, so everyone must agree.","feedbackJa":"反復から同意を断定している。"},{"text":"I explained it three times, but I still have not got my point across.","feedbackJa":"説明回数と伝達の成否を分けている。"},{"text":"I have not explained it at all.","feedbackJa":"三回説明したという事実と矛盾する。"},{"text":"Everyone accepted my proposal immediately.","feedbackJa":"要点が伝わっていない状況と矛盾する。"}],"correctIndex":1,"explanationJa":"説明したという行動と、その内容が理解されたという結果は同じではない。","focusJa":"行動と結果の区別"}],"domainIds":["education","communication","environment"],"sourceReferences":[{"title":"Cambridge Dictionary: get something across","url":"https://dictionary.cambridge.org/dictionary/english/get-across"},{"title":"British Council: Word order in phrasal verbs","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/c1/word-order-phrasal-verbs"}],"contentSha256":"bd6712473e199b8ed45afd3a7d8d20c17abf56c34d5d59e25f2c5e9a48302727","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_pipeline_design","reviewedAt":"2026-10-23T14:10:48.471Z","contentSha256":"bd6712473e199b8ed45afd3a7d8d20c17abf56c34d5d59e25f2c5e9a48302727"},"audio":{"status":"not-generated"}},{"id":"verbs-take-core","series":"verbs","titleJa":"take：持っていく・時間・責任","levelTargets":["B1","B2"],"goalJa":"take の目的語から、移動・所要時間・担当や責任を読み分ける。","conceptJa":"take は「取る」だけではない。物を別の場所へ持っていく、時間を要する、責任を引き受けるなど、後ろの語との組み合わせで意味が決まる。","commonTrapJa":"take responsibility をいつも「失敗を認める」と訳さない。これからの担当を引き受ける意味にもなる。","usageNotes":["It takes 人 時間 to do で、人が何かをするのに必要な時間を表す。","take responsibility for + 名詞・動名詞は、担当を引き受ける場合にも過失を認める場合にも使う。","take your time は急がなくてよいという声かけ。物理的に時間を持ち去る意味ではない。"],"examples":[{"id":"verbs-take-core-ex1","text":"Please take these books to the library when you leave school.","meaningJa":"学校を出るときに、これらの本を図書館へ持っていってください。","contextJa":"物の移動"},{"id":"verbs-take-core-ex2","text":"It took our group two afternoons to prepare the display.","meaningJa":"展示の準備には、私たちの班で午後を2回分使った。","contextJa":"課題の所要時間"},{"id":"verbs-take-core-ex3","text":"I will take responsibility for checking the sources in our essay.","meaningJa":"私たちの作文の出典確認は私が責任を持って担当する。","contextJa":"共同作業の分担"},{"id":"verbs-take-core-ex4","text":"Take your time; the next bus is not due for another twenty minutes.","meaningJa":"急がなくていいよ。次のバスまではまだ20分ある。","contextJa":"旅行中の声かけ"}],"contrasts":[{"leftEnglish":"It took me an hour to revise the essay.","rightEnglish":"I spent an hour revising the essay.","noteJa":"同じ時間を別の構文で表す。take の主語は形式主語 it、spend の主語は人。"},{"leftEnglish":"I take responsibility for arranging the trip.","rightEnglish":"I take responsibility for the booking mistake.","noteJa":"左は担当の引き受け。右は文脈によりミスの責任を認める。"}],"questions":[{"id":"verbs-take-core-q1","type":"context","scenarioJa":"読書感想文を書き終えるまでに2時間かかった。","prompt":"It ___ me two hours to finish the essay.","choices":[{"text":"spent","feedbackJa":"spend は通常、時間を使う人を主語にする。"},{"text":"gave","feedbackJa":"この形では所要時間を表せない。"},{"text":"took","feedbackJa":"It took 人 時間 to do の形。"},{"text":"made","feedbackJa":"make ではこの所要時間構文にならない。"}],"correctIndex":2,"explanationJa":"take は時間を要するという意味でも使う。","focusJa":"所要時間の構文"},{"id":"verbs-take-core-q2","type":"meaning","scenarioJa":"班分けの時に “I will take responsibility for collecting the data.” と言った。","prompt":"この場面での意味は？","choices":[{"text":"データを失くしたと必ず認めている。","feedbackJa":"分担の場面なので過失を認めるとは限らない。"},{"text":"データ収集を中止すると言っている。","feedbackJa":"責任を持って行うという内容と逆。"},{"text":"他の人にすべての責任を押し付けている。","feedbackJa":"I will が自分の引き受けを示す。"},{"text":"自分が責任を持ってデータ収集を担当する。","feedbackJa":"これからの役割を引き受ける表現。"}],"correctIndex":3,"explanationJa":"responsibility は義務・担当にも、過失の責任にもなる。場面を読む。","focusJa":"責任の二つの意味"},{"id":"verbs-take-core-q3","type":"intent","scenarioJa":"友人が焦って荷物をまとめているが、十分な余裕がある。","prompt":"「急がなくていい」と伝える文は？","choices":[{"text":"Take your time.","feedbackJa":"焦らず進めてよいと伝える。"},{"text":"Take all the blame.","feedbackJa":"すべての非を引き受けて、という意味。"},{"text":"Take the bus now.","feedbackJa":"今バスに乗って、という指示。"},{"text":"Take the books away.","feedbackJa":"本を持ち去って、という指示。"}],"correctIndex":0,"explanationJa":"take your time は相手に時間の余裕を与える表現。","focusJa":"会話での意図"},{"id":"verbs-take-core-q4","type":"usage","scenarioJa":"「結果の確認を責任を持って担当する」と書く。","prompt":"正しい形は？","choices":[{"text":"I take responsibility of checking the results.","feedbackJa":"この担当の表現では for を使う。"},{"text":"I take responsibility for checking the results.","feedbackJa":"for + 動名詞で担当内容を示す。"},{"text":"I take responsibility for check the results.","feedbackJa":"for の後に動詞原形は置かない。"},{"text":"I take responsibility to checking the results.","feedbackJa":"to checking ではこの形にならない。"}],"correctIndex":1,"explanationJa":"take responsibility for doing のまとまりで使えるようにする。","focusJa":"責任の対象の形"},{"id":"verbs-take-core-q5","type":"meaning","scenarioJa":"長文の “It took several years for the forest to recover.” を読む。","prompt":"本文と一致するのは？","choices":[{"text":"森は数分で回復した。","feedbackJa":"several years と矛盾する。"},{"text":"森は決して回復しなかった。","feedbackJa":"回復までの時間を述べている。"},{"text":"森の回復には数年を要した。","feedbackJa":"take の時間の意味を保つ。"},{"text":"森は毎年別の場所へ移動した。","feedbackJa":"物理的な移動の意味ではない。"}],"correctIndex":2,"explanationJa":"It takes time for something to happen でも所要時間を示せる。","focusJa":"長文での時間表現"},{"id":"verbs-take-core-q6","type":"intent","scenarioJa":"展示準備の担当は引き受けるが、まだ何も失敗していない。","prompt":"誤って過失を認める内容にせず担当を示す文は？","choices":[{"text":"I admit that I caused the damage.","feedbackJa":"損害を起こしたと認めている。"},{"text":"I deny that I have any duties.","feedbackJa":"担当を否定している。"},{"text":"I blame the other group for the delay.","feedbackJa":"別の班に遅れの責任を負わせている。"},{"text":"I will take responsibility for preparing the display.","feedbackJa":"これからの担当を明示している。"}],"correctIndex":3,"explanationJa":"for の後ろで何の責任かを明確にすると、意図が伝わる。","focusJa":"作文で責任の範囲を示す"}],"domainIds":["education","travel","environment"],"sourceReferences":[{"title":"Cambridge English Grammar Today: Take","url":"https://dictionary.cambridge.org/grammar/british-grammar/take"},{"title":"Cambridge Dictionary: responsibility","url":"https://dictionary.cambridge.org/dictionary/english/responsibility"}],"contentSha256":"7d867079a1a9a835d5ba2aac9c75244d4e066ae2079e557dfcf280925b6ddc8e","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_pipeline_design","reviewedAt":"2026-10-23T14:10:48.471Z","contentSha256":"7d867079a1a9a835d5ba2aac9c75244d4e066ae2079e557dfcf280925b6ddc8e"},"audio":{"status":"not-generated"}},{"id":"verbs-take-off","series":"verbs","titleJa":"take off：脱ぐ・離陸する・急に伸びる","levelTargets":["B1","B2"],"goalJa":"長文の主語と目的語から take off の意味を判断し、代名詞の語順も使える。","conceptJa":"服を取り外すときは目的語を取る。飛行機の離陸や事業の急成長では、その飛行機・事業が主語になり、後ろに目的語を置かない。","commonTrapJa":"take off を必ず離陸と訳さない。take it off は「それを外す」で、it の位置を後ろには動かせない。","usageNotes":["名詞なら take off your coat / take your coat off の両方が可能。代名詞は take it off。","人気や事業が take off する場合は、勢いよく伸び始める比喩。単に計画を作っただけとは違う。","take a day off は通常の仕事や活動を休むこと。出発を意味する take off とは分けて読む。"],"examples":[{"id":"verbs-take-off-ex1","text":"Please take your muddy shoes off before entering the classroom.","meaningJa":"教室に入る前に、泥のついた靴を脱いでください。","contextJa":"学校での依頼"},{"id":"verbs-take-off-ex2","text":"Our plane took off just after the rain stopped.","meaningJa":"雨がやんですぐに私たちの飛行機は離陸した。","contextJa":"旅行の記録"},{"id":"verbs-take-off-ex3","text":"The student magazine took off after its first interview was shared online.","meaningJa":"最初のインタビューがネットで共有された後、その学生雑誌は急に人気が出た。","contextJa":"活動の成長"},{"id":"verbs-take-off-ex4","text":"My father took a day off to attend the school concert.","meaningJa":"父は学校のコンサートに来るため、仕事を1日休んだ。","contextJa":"予定の調整"}],"contrasts":[{"leftEnglish":"She took her jacket off.","rightEnglish":"She took off her jacket.","noteJa":"名詞の目的語なら両方自然。どちらかだけを誤答にしない。"},{"leftEnglish":"The plane took off.","rightEnglish":"The project took off.","noteJa":"左は離陸、右は事業や活動の急な成長。主語から意味を絞る。"}],"questions":[{"id":"verbs-take-off-q1","type":"usage","scenarioJa":"ジャケットを it で受け、「それを脱いでください」と言う。","prompt":"正しい語順は？","choices":[{"text":"Please take it off.","feedbackJa":"代名詞を take と off の間に置く。"},{"text":"Please take off it.","feedbackJa":"代名詞 it を off の後ろには置かない。"},{"text":"Please take it to off.","feedbackJa":"この句動詞に to は入れない。"},{"text":"Please it take off.","feedbackJa":"目的語を動詞の前に置かない。"}],"correctIndex":0,"explanationJa":"名詞の位置には選択肢があるが、短い目的語代名詞の位置は固定される。","focusJa":"分離可能な句動詞"},{"id":"verbs-take-off-q2","type":"meaning","scenarioJa":"活動紹介に “The campaign really took off in its second month.” とある。","prompt":"何が起きたという意味？","choices":[{"text":"活動を完全に中止した。","feedbackJa":"成長と逆の意味。"},{"text":"活動が2か月目に急に勢いづいた。","feedbackJa":"抽象的な主語の take off。"},{"text":"活動の全員が飛行機に乗った。","feedbackJa":"移動を示す情報はない。"},{"text":"2か月目まで計画が存在しなかった。","feedbackJa":"存在の開始ではなく成長を述べる。"}],"correctIndex":1,"explanationJa":"campaign のような活動が主語なら、成功や人気の拡大を表せる。","focusJa":"比喩の読み取り"},{"id":"verbs-take-off-q3","type":"context","scenarioJa":"空港の案内で、雨のため離陸が遅れると聞いた。","prompt":"The plane will ___ thirty minutes later than planned.","choices":[{"text":"take the coat off","feedbackJa":"衣服を脱ぐ内容になり、飛行機の出発ではない。"},{"text":"take responsibility","feedbackJa":"責任を引き受けるという意味。"},{"text":"take off","feedbackJa":"飛行機が地面を離れて飛び始める。"},{"text":"take a day off","feedbackJa":"休暇を取るという別の表現。"}],"correctIndex":2,"explanationJa":"目的語のない take off で離陸を表す。","focusJa":"主語による意味の選択"},{"id":"verbs-take-off-q4","type":"intent","scenarioJa":"休暇の理由を「病院に付き添うため、仕事を1日休んだ」と説明する。","prompt":"意図に合う文は？","choices":[{"text":"I took my coat off to visit the hospital.","feedbackJa":"上着を脱いだだけで休暇は表さない。"},{"text":"The hospital took off yesterday.","feedbackJa":"病院の成長などの意味になってしまう。"},{"text":"I took off in a plane for work.","feedbackJa":"仕事で飛行機に乗ったという別の内容。"},{"text":"I took a day off to accompany my mother to the hospital.","feedbackJa":"休みとその目的を示している。"}],"correctIndex":3,"explanationJa":"take + 時間 + off は、その間いつもの仕事などを休むこと。","focusJa":"休暇の表現"},{"id":"verbs-take-off-q5","type":"meaning","scenarioJa":"“Her online shop took off, but she still had to manage costs carefully.” とある。","prompt":"正しい読み取りは？","choices":[{"text":"店は伸びたが、費用の管理は引き続き必要だった。","feedbackJa":"成長と費用管理の必要を両立して読む。"},{"text":"店が伸びたので費用を無視してよくなった。","feedbackJa":"but 以下と反対。"},{"text":"店が飛行機の中に移転した。","feedbackJa":"比喩を物理的な離陸と取り違えている。"},{"text":"店は開店前に閉鎖された。","feedbackJa":"took off の成長と合わない。"}],"correctIndex":0,"explanationJa":"take off は勢いづくこと。利益や将来の成功まで無条件に保証する語ではない。","focusJa":"比喩と推論の限界"},{"id":"verbs-take-off-q6","type":"usage","scenarioJa":"your hat を名詞のまま使って、帽子を脱ぐ依頼を比較する。","prompt":"自然な二つの語順について正しい説明は？","choices":[{"text":"“Take your hat off” だけが正しい。","feedbackJa":"名詞ならもう一つの語順も可能。"},{"text":"“Take your hat off” と “Take off your hat” は両方自然。","feedbackJa":"名詞の目的語は両位置に置ける。"},{"text":"“Take off your hat” だけが正しい。","feedbackJa":"名詞を間に置いてもよい。"},{"text":"どちらも離陸だけを意味する。","feedbackJa":"目的語 your hat が取り外す意味を示す。"}],"correctIndex":1,"explanationJa":"語順の自由度は名詞と代名詞で異なる。自然な変種を誤りと覚えない。","focusJa":"正しい変種を認める"}],"domainIds":["education","travel","business"],"sourceReferences":[{"title":"Cambridge Dictionary: take off","url":"https://dictionary.cambridge.org/us/dictionary/english/take-off"},{"title":"British Council: Word order in phrasal verbs","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/c1/word-order-phrasal-verbs"}],"contentSha256":"e0f22bfa147e61480747adc9d1f6177a5ed569854fb00b430b3a6533818b2923","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_pipeline_design","reviewedAt":"2026-10-23T14:10:48.471Z","contentSha256":"e0f22bfa147e61480747adc9d1f6177a5ed569854fb00b430b3a6533818b2923"},"audio":{"status":"not-generated"}},{"id":"verbs-break-through","series":"verbs","titleJa":"break through：壁を突破する、を比喩まで読む","levelTargets":["B1","B2"],"goalJa":"物理的な障害と抽象的な壁を区別し、動詞 break through と名詞 breakthrough を使い分ける。","conceptJa":"break through は、進むのを妨げる物や限界を突き抜けること。研究や交渉では行き詰まりを突破する比喩になる。","commonTrapJa":"breakthrough を一語の動詞として使わない。また、突破口が開いても全問題が解決したとは限らない。","usageNotes":["break through a barrier の barrier は物理的にも比喩的にも使える。代名詞なら break through it。","名詞は a breakthrough / a breakthrough in research のように使う。","「問題を解く」すべてを break through に置き換えない。障害・限界を越えるイメージがあるか確認する。"],"examples":[{"id":"verbs-break-through-ex1","text":"The roots broke through the old pavement.","meaningJa":"根が古い舗道を突き破った。","contextJa":"自然と構造物"},{"id":"verbs-break-through-ex2","text":"Sharing their notes helped the students break through a language barrier.","meaningJa":"ノートを共有したことが、生徒たちの言葉の壁を越える助けになった。","contextJa":"交流学習"},{"id":"verbs-break-through-ex3","text":"The new experiment led to a breakthrough in the team’s research.","meaningJa":"新しい実験が、そのチームの研究に突破口をもたらした。","contextJa":"研究についての長文"},{"id":"verbs-break-through-ex4","text":"They broke through the deadlock, but several details still needed discussion.","meaningJa":"行き詰まりは打開できたが、いくつかの細部はまだ話し合う必要があった。","contextJa":"交渉の進展"}],"contrasts":[{"leftEnglish":"They broke through the barrier.","rightEnglish":"They made a breakthrough.","noteJa":"左は動詞と障害の組み合わせ、右は名詞を目的語にした「大きな進展」。"},{"leftEnglish":"We solved the equation.","rightEnglish":"We broke through a barrier to understanding.","noteJa":"計算問題を解く通常の表現は左。右は理解を妨げる壁を越える比喩で、単純な置換ではない。"}],"questions":[{"id":"verbs-break-through-q1","type":"context","scenarioJa":"研究で重要な進展があったことを名詞で表す。","prompt":"The team made a ___ after months of tests.","choices":[{"text":"break through","feedbackJa":"この空所は a の後の名詞。"},{"text":"broke through","feedbackJa":"過去形の動詞句はここに置かない。"},{"text":"breakthrough","feedbackJa":"一語の名詞で重要な進展。"},{"text":"breaking through it","feedbackJa":"a の後の名詞としてこの形は使わない。"}],"correctIndex":2,"explanationJa":"動詞の break through と名詞の breakthrough は綴りと働きが違う。","focusJa":"動詞と名詞の区別"},{"id":"verbs-break-through-q2","type":"meaning","scenarioJa":"“The discovery was a breakthrough, but not a complete solution.” とある。","prompt":"最も適切な要約は？","choices":[{"text":"問題はすべて完全に解決した。","feedbackJa":"not a complete solution と矛盾する。"},{"text":"研究は一歩も進まなかった。","feedbackJa":"breakthrough は重要な進展。"},{"text":"発見の価値がないと結論づけた。","feedbackJa":"重要な前進と評価している。"},{"text":"重要な前進だが、未解決の部分もある。","feedbackJa":"二つの内容をともに保つ。"}],"correctIndex":3,"explanationJa":"breakthrough は大きな進展であって、残る問題がないという保証ではない。","focusJa":"読解での過剰な推論を避ける"},{"id":"verbs-break-through-q3","type":"usage","scenarioJa":"障害を it で受け、突破できたと述べる。","prompt":"正しい語順は？","choices":[{"text":"We finally broke through it.","feedbackJa":"この through の後ろに障害を置く。"},{"text":"We finally broke it through.","feedbackJa":"この「障害を突破する」意味では分離しない。"},{"text":"We finally breakthrough it.","feedbackJa":"breakthrough はこの形の動詞ではない。"},{"text":"We finally broken through it.","feedbackJa":"過去形には broke、完了形なら have broken。"}],"correctIndex":0,"explanationJa":"break through something は、take something off のようには分離しない。","focusJa":"非分離の語順"},{"id":"verbs-break-through-q4","type":"intent","scenarioJa":"作文で「方程式を解いた」と事実だけを自然に述べる。","prompt":"最も直接的な文は？","choices":[{"text":"I broke through an equation.","feedbackJa":"方程式を障害として扱う比喩は、通常の解答の報告には不向き。"},{"text":"I solved the equation.","feedbackJa":"方程式を解いたという通常の表現。"},{"text":"I made the equation disappear from the paper.","feedbackJa":"紙から消したという別の内容。"},{"text":"I postponed the equation until next week.","feedbackJa":"先延ばしにした意味になる。"}],"correctIndex":1,"explanationJa":"break through は万能な solve の代わりではない。伝えたい意味に合わせる。","focusJa":"比喩の使用範囲"},{"id":"verbs-break-through-q5","type":"meaning","scenarioJa":"国際交流の記事で “They broke through the language barrier.” とある。","prompt":"この barrier は何を表す？","choices":[{"text":"教室に置かれた金属製の柵だけ。","feedbackJa":"language が抽象的な障害を指定している。"},{"text":"会話に必ず必要な正式な資格。","feedbackJa":"資格という意味ではない。"},{"text":"言葉の違いによる意思疎通の難しさ。","feedbackJa":"言語が作る障害の比喩。"},{"text":"外国語を一生使わない約束。","feedbackJa":"むしろ意思疎通の障害を越えている。"}],"correctIndex":2,"explanationJa":"前後の名詞から、物理的な壁か抽象的な困難かを判断する。","focusJa":"抽象的な障害の読解"},{"id":"verbs-break-through-q6","type":"intent","scenarioJa":"蓄電池の研究で重要な前進があった。ただし、全課題が解決したわけではない。","prompt":"その事実を適切な強さで述べる文は？","choices":[{"text":"The team solved every problem in battery research.","feedbackJa":"全課題が解決したという、事実を超えた主張。"},{"text":"The team abandoned battery research without making progress.","feedbackJa":"前進せず断念したという逆の報告。"},{"text":"The team only changed the title of its battery report.","feedbackJa":"報告書の題名を変えただけでは重要な前進を伝えない。"},{"text":"The team made a breakthrough in battery research.","feedbackJa":"その分野で重要な進展があったことを表す。"}],"correctIndex":3,"explanationJa":"a breakthrough in + 分野は重要な進展。すべての課題が解決したとは述べていない。","focusJa":"進展を過大評価せずに書く"}],"domainIds":["science","education","communication"],"sourceReferences":[{"title":"Cambridge Dictionary: break through","url":"https://dictionary.cambridge.org/dictionary/english/break-through"},{"titl _ for twenty minutes before breakfast.”","choices":[{"text":"work out","feedbackJa":"この質問への応答では運動を意味する。"},{"text":"work it out","feedbackJa":"it の示す問題がなく、運動の意味にもならない。"},{"text":"work the total out","feedbackJa":"合計を計算するという別の行為。"},{"text":"work out the timetable","feedbackJa":"時間割を考えるという別の行為。"}],"correctIndex":0,"explanationJa":"目的語のない work out は、運動の話題なら体を動かすこと。","focusJa":"会話の話題から補う"},{"id":"verbs-work-out-q6","type":"intent","scenarioJa":"旅行の一人分の費用を計算するため、相談を始める。","prompt":"適切な問いかけは？","choices":[{"text":"Shall we hide the price from everyone?","feedbackJa":"費用を隠すという逆の目的。"},{"text":"Shall we work out how much each person will pay?","feedbackJa":"一人分の金額を計算する相談。"},{"text":"Shall we say the trip has already been cancelled?","feedbackJa":"中止の話で、計算ではない。"},{"text":"Shall we spend the money without checking the cost?","feedbackJa":"費用の確認を避けている。"}],"correctIndex":1,"explanationJa":"work out の後ろには how much などで始まる節も置ける。","focusJa":"計算する内容を節で表す"}],"domainIds":["education","finance","health"],"sourceReferences":[{"title":"Cambridge Dictionary: work out","url":"https://dictionary.cambridge.org/dictionary/english/work-out"},{"title":"British Council: Word order in phrasal verbs","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/c1/word-order-phrasal-verbs"}],"contentSha256":"bdf0a79c600db283a9724e9ee74a7a16def8f1130e30b668026d9932c11d989a","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_pipeline_design","reviewedAt":"2026-10-23T14:10:48.471Z","contentSha256":"bdf0a79c600db283a9724e9ee74a7a16def8f1130e30b668026d9932c11d989a"},"audio":{"status":"not-generated"}},{"id":"verbs-turn-out","series":"verbs","titleJa":"turn out：結局の結果・判明した事実","levelTargets":["B1","B2"],"goalJa":"予想と結果の対比を読み、turn out to be / it turns out that で発見を述べる。","conceptJa":"turn out は結果がどうなったか、後で何がわかったかを示す。必ず良い結果になる意味ではなく、良い・悪いの両方を続けられる。","commonTrapJa":"turn out を常に「成功する」と読まない。また、事実の判明と実際の状態変化を混同しない。","usageNotes":["The story turned out to be false のように t t the purchase off.","noteJa":"左は値段で気持ちが引いたこと、右は自分が購入を後に延ばしたこと。"}],"questions":[{"id":"verbs-put-off-q1","type":"meaning","scenarioJa":"“The cost put several families off joining the trip.” とある。","prompt":"費用はどんな影響を与えた？","choices":[{"text":"いくつかの家庭の参加意欲をそいだ。","feedbackJa":"人を目的語にした、する気をなくさせる意味。"},{"text":"参加費を必ず無料にした。","feedbackJa":"費用がなくなったとは述べていない。"},{"text":"全家庭の日程を同じ日に決めた。","feedbackJa":"日程を決める内容ではない。"},{"text":"全家庭の参加を法律で禁止した。","feedbackJa":"心理的な障壁で、法的禁止とは限らない。"}],"correctIndex":0,"explanationJa":"put someone off doing は、その行為への意欲を失わせること。","focusJa":"目的語と意味の関係"},{"id":"verbs-put-off-q2","type":"context","scenarioJa":"申込書を記入するのを先延ばしにしている。","prompt":"I keep putting off ___ the application form.","choices":[{"text":"to complete","feedbackJa":"put off の後にこの不定詞は続けない。"},{"text":"completing","feedbackJa":"延期する行為を動名詞で表す。"},{"text":"complete","feedbackJa":"動詞原形を直接続けない。"},{"text":"completed","feedbackJa":"過去形では行為の目的語にならない。"}],"correctIndex":1,"explanationJa":"put off doing で「するのを先延ばしにする」。","focusJa":"句動詞 + 動名詞"},{"id":"verbs-put-off-q3","type":"usage","scenarioJa":"予定を it で受けて「来週まで延ばそう」と言う。","prompt":"正しい形は？","choices":[{"text":"Let us put off it until next week.","feedbackJa":"it は put と off の間。"},{"text":"Let us put it to off until next week.","feedbackJa":"to は不要。"},{"text":"Let us put it off until next week.","feedbackJa":"目的語代名詞の位置が正しい。"},{"text":"Let us it put off until next week.","feedbackJa":"目的語をこの位置には置かない。"}],"correctIndex":2,"explanationJa":"put it off until + 時期で、先延ばしにする期限を示せる。","focusJa":"延期の語順"},{"id":"verbs-put-off-q4","type":"intent","scenarioJa":"イベントを取りやめず、悪天候のため翌週に延期したい。","prompt":"意図に合う文は？","choices":[{"text":"We will cancel the event permanently.","feedbackJa":"実施を取りやめる意味。"},{"text":"We will hold the event earlier than planned.","feedbackJa":"予定を前倒しするので逆。"},{"text":"We will stop discussing the event forever.","feedbackJa":"議論をやめることで、延期ではない。"},{"text":"Could we put the event off until next week?","feedbackJa":"延期の提案を丁寧に示す。"}],"correctIndex":3,"explana :"bring a topic up は話題に出すこと。bring a child up は子どもを育てること。後ろに来る名詞や受動態の文脈で意味を決める。","commonTrapJa":"話題に出しただけで、解決した・決定したと判断しない。bring up と grow up では、育てる側と育つ側が違う。","usageNotes":["話題が代名詞なら bring it up。bring up it とはしない。","bring someone up は養育する側が主語。育つ本人が主語なら grow up が使える。","Could I bring up one concern? は議論に懸念を出す丁寧な導入になる。"],"examples":[{"id":"verbs-bring-up-ex1","text":"Could I bring up one concern before we choose a topic?","meaningJa":"テーマを選ぶ前に、懸念を一つ挙げてもよいですか。","contextJa":"討論の導入"},{"id":"verbs-bring-up-ex2","text":"The article brings up a question about who should pay for public services.","meaningJa":"その記事は、公共サービスの費用を誰が払うべきかという問いを提起している。","contextJa":"社会分野の長文"},{"id":"verbs-bring-up-ex3","text":"He was brought up by his aunt in a small coastal town.","meaningJa":"彼は海辺の小さな町で叔母に育てられた。","contextJa":"人物の背景"},{"id":"verbs-bring-up-ex4","text":"I did not bring it up at lunch because we had agreed to discuss it later.","meaningJa":"後で話し合うと決めていたので、昼食時にはその話を持ち出さなかった。","contextJa":"話題を出す時機"}],"contrasts":[{"leftEnglish":"His aunt brought him up.","rightEnglish":"He grew up near the coast.","noteJa":"左は養育した人、右は育った本人が主語。"},{"leftEnglish":"She brought up the problem.","rightEnglish":"She solved the problem.","noteJa":"話題に出すことと解決することは別。bring up だけでは解決したとは言えない。"}],"questions":[{"id":"verbs-bring-up-q1","type":"meaning","scenarioJa":"“The writer brings up the issue of unequal access.” とある。","prompt":"筆者は何をしている？","choices":[{"text":"不平等の問題を必ず解決している。","feedbackJa":"話題に出すことから解決までは言えない。"},{"text":"問題が存在しないと証明している。","feedbackJa":"取り上げる意味と異なる。"},{"text":"利用機会の不平等を話題として取り上げている。","feedbackJa":"bring up の議論の意味。"},{"text":"子どもを養育している。","feedbackJa":"目的語が issue なので養育ではない。"}],"correctIndex":2,"explanationJa":"issue や question が目的語なら、話題として持ち出すこと。","focusJa":"論説文の動作を読む"},{"id":"verbs-bring-up-q2","type":"usage","scenarioJa":"既出の問題を it で受けて「次の会議で持ち出そう」と言う。","prompt":"正しい形は？","choices":[{"text":"Let us bring up it at the next meeting.","feedbackJa":"代名詞 it は間に置く。"},{"text":"Let us bring it to up at t ":"British Council: Word order in phrasal verbs","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/c1/word-order-phrasal-verbs"}],"contentSha256":"03a2e746c08aca98b9edddda4257b4e89be0106b7d58f0183a29a38bbe9cad87","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_pipeline_design","reviewedAt":"2026-10-23T14:10:48.471Z","contentSha256":"03a2e746c08aca98b9edddda4257b4e89be0106b7d58f0183a29a38bbe9cad87"},"audio":{"status":"not-generated"}},{"id":"verbs-make-do","series":"verbs","titleJa":"make と do：「作る」で一括りにしない","levelTargets":["B1","B2"],"goalJa":"よく使う組み合わせを意味とともに覚え、作文の基本動詞を安定させる。","conceptJa":"do は作業や活動、make は生まれる物や結果に焦点を当てる傾向がある。ただし万能な規則ではなく、make progress、do damage のような組み合わせも覚える。","commonTrapJa":"日本語が「作る」なら必ず make、という機械的な訳し方をしない。do の「十分だ」という用法も見逃さない。","usageNotes":["do homework / do research、make a mistake / make progress のまとまりを使う。","do は do a drawing など制作活動にも使え、単純な「do は何も作らない」というルールではない。","That will do は「それで十分・それでよい」。文脈によって作業を止める声かけにもなる。"],"examples":[{"id":"verbs-make-do-ex1","text":"I did the research before making a list of possible solutions.","meaningJa":"考えられる解決策を一覧にする前に、調査を行った。","contextJa":"作文の準備"},{"id":"verbs-make-do-ex2","text":"We made progress even though we did not finish the project.","meaningJa":"計画を完了はしなかったが、進展はあった。","contextJa":"学習の振り返り"},{"id":"verbs-make-do-ex3","text":"The storm did serious damage to the school garden.","meaningJa":"嵐は学校の庭に深刻な被害を与えた。","contextJa":"環境についての長文"},{"id":"verbs-make-do-ex4","text":"We do not need a large room; a small one will do.","meaningJa":"広い部屋は必要ない。小さい部屋で十分だ。","contextJa":"行事の準備"}],"contrasts":[{"leftEnglish":"We did some research.","rightEnglish":"We made a research plan.","noteJa":"左は調査活動を行う、右は調査計画を作る。research は通常不可算、plan は数えられる。"},{"leftEnglish":"She made a mistake.","rightEnglish":"She did the task.","noteJa":"前者は生じた誤り、後者は行った作業。組み合わせごとに覚える。"}],"questions":[{"id":"verbs-make-do-q1","type":"context","scenarioJa":"共同作文の準備として調査を行った。","prompt":"We ___ som
