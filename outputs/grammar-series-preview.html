lly?","choices":[{"text":"Advice is useful when it addresses the actual problem.","feedbackJa":"助言一般を冠詞なしの不可算名詞で表しています。"},{"text":"An advice is useful when it addresses the actual problem.","feedbackJa":"通常、adviceをanで数えません。"},{"text":"Advices is useful when it addresses the actual problem.","feedbackJa":"通常の語形と数の一致が合いません。"},{"text":"Many advice is useful when it addresses the actual problem.","feedbackJa":"manyは通常adviceに使いません。"}],"correctIndex":0,"explanationJa":"助言一般ならAdvice。特定の助言ならthe adviceも使える。","focusJa":"不可算名詞の一般的な話"}],"domainIds":["education","communication","travel"],"sourceReferences":[{"title":"British Council: Nouns — countable and uncountable","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/a1-a2/nouns-countable-uncountable"},{"title":"British Council LearnEnglish Kids: Articles","url":"https://learnenglishkids.britishcouncil.org/grammar-vocabulary/grammar-practice/articles"},{"title":"BBC Learning English: Articles introduction","url":"https://downloads.bbc.co.uk/worldservice/learningenglish/grammarchallenge/pdfs/gc_23_articles_intro_explanation.pdf"}],"contentSha256":"f228b0e219eb2a78e899480db932283fe819e6ba50ede74a2877d9c49ea97f29","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_library_integration","reviewedAt":"2026-10-23T14:12:03.794Z","contentSha256":"f228b0e219eb2a78e899480db932283fe819e6ba50ede74a2877d9c49ea97f29"},"audio":{"status":"not-generated"}},{"id":"grammar-modal-meaning","series":"grammar","titleJa":"助動詞で、提案・義務・確かさを調整する","levelTargets":["A2","B1","B2"],"goalJa":"shall・should・must・mightが示す、申し出・助言・義務・推測を読み分ける。","conceptJa":"助動詞は動作だけでなく話し手の姿勢を示す。Shall I/weは申し出や提案、shouldは助言など、mustは義務や強い推測、mightは可能性に使う。","commonTrapJa":"mustを常に「〜しなければならない」と訳さない。must notの禁止とdo not have toの不要も区別する。","usageNotes":["Shall I carry it?は申し出、Should I carry it?は運ぶべきかの助言を求める質問になりやすい。","mustやmightによる推測に、いつも固定した確率の数字を当てはめない。証拠と話し手の判断を読む。","助動詞の後は通常動詞の原形。should goes、must to goのようにはしない。"],"examples":[{"id":"grammar-modal-meaning-ex1","text":"Shall I read the question aloud?","meaningJa":"問題を声に出して読みましょうか。","contextJa":"相手に手伝いを申し出る。"},{"id":"grammar-modal-meaning-ex2","text":"You should support your opinion with an example.","meaningJa":"意見は例で裏付けるとよいでしょう。","contextJa":"英作文への助言。"},{"id":"grammar-modal-meaning-ex3","text":"All visitors must wear a badge in this laboratory.","meaningJa":"この実験室では、来訪者は全員バッジを着けなければなりません。","contextJa":"この施設の規則。"},{"id":"grammar-modal-meaning-ex4","text":"The route might be crowded after the match.","meaningJa":"試合後は、その経路が混雑するかもしれません。","contextJa":"不確かな可能性。"}],"contrasts":[{"leftEnglish":"You must not use this door.","rightEnglish":"You do not have to use this door.","noteJa":"左は使用禁止。右は使用する必要がないという意味で、使用禁止ではない。"},{"leftEnglish":"She must be tired after that journey.","rightEnglish":"She might be tired after that journey.","noteJa":"左は状況からの強い推測、右は可能性として控えめに述べる。"}],"questions":[{"id":"grammar-modal-meaning-q1","type":"intent","scenarioJa":"友人の荷物を持つことを、Shall Iで申し出たい。","prompt":"Which sentence does this?","choices":[{"text":"I should have carried your bag yesterday.","feedbackJa":"過去を振り返っています。"},{"text":"Must I carried your bag?","feedbackJa":"助動詞の後の形が誤りです。"},{"text":"I might have a bag at home.","feedbackJa":"家にあるかもしれない物の話です。"},{"text":"Shall I carry your bag?","feedbackJa":"自分が持とうかと申し出ています。"}],"correctIndex":3,"explanationJa":"Shall I＋原形は申し出に使える。Should Iなら判断について助言を求める意味になりやすい。","focusJa":"申し出"},{"id":"grammar-modal-meaning-q2","type":"context","scenarioJa":"友人に、作文に例を加えるとよいと助言する。","prompt":"You should ___ an example to support your point.","choices":[{"text":"adds","feedbackJa":"助動詞の後は原形です。"},{"text":"add","feedbackJa":"should＋原形になります。"},{"text":"to add","feedbackJa":"shouldの直後にtoを置きません。"},{"text":"added","feedbackJa":"過去形は置きません。"}],"correctIndex":1,"explanationJa":"should addは助言。規則として必須かどうかまではこの形だけで決まらない。","focusJa":"助言の形"},{"id":"grammar-modal-meaning-q3","type":"meaning","scenarioJa":"実験室の安全規則を読む。","prompt":"“Visitors must wear eye protection.” What does must express here?","choices":[{"text":"A weak guess about what visitors probably wear.","feedbackJa":"安全規則の文脈なので推測ではありません。"},{"text":"Permission to choose any equipment.","feedbackJa":"任意の選択の許可ではありません。"},{"text":"A requirement under this rule.","feedbackJa":"保護具の着用義務です。"},{"text":"An event completed last month.","feedbackJa":"過去の出来事ではありません。"}],"correctIndex":2,"explanationJa":"このmustは義務。実験室の規則という文脈で判断する。","focusJa":"義務のmust"},{"id":"grammar-modal-meaning-q4","type":"meaning","scenarioJa":"追加練習が任意だと伝えられる。","prompt":"“You do not have to attend the extra session.” What does this mean?","choices":[{"text":"Attendance is not necessary.","feedbackJa":"参加は必須ではありません。"},{"text":"Attendance is forbidden.","feedbackJa":"禁止ではありません。"},{"text":"Attendance happened yesterday.","feedbackJa":"過去に参加したとは述べていません。"},{"text":"Attendance is a legal requirement.","feedbackJa":"義務という意味とは逆です。"}],"correctIndex":0,"explanationJa":"do not have toは不要。must notなら禁止を表す。","focusJa":"不要と禁止"},{"id":"grammar-modal-meaning-q5","type":"meaning","scenarioJa":"相手が夜通し移動し、眠そうなのを見て話す。","prompt":"“You must be exhausted.” What does must express here?","choices":[{"text":"An order to become exhausted immediately.","feedbackJa":"疲れるよう命令していません。"},{"text":"A rule requiring all passengers to sleep.","feedbackJa":"乗客への規則ではありません。"},{"text":"A refusal to discuss the journey.","feedbackJa":"話題を拒否する表現ではありません。"},{"text":"A strong conclusion based on the situation.","feedbackJa":"状況から「とても疲れているはず」と推測しています。"}],"correctIndex":3,"explanationJa":"must beは証拠に基づく強い推測にも使う。義務の意味だけではない。","focusJa":"推測のmust"},{"id":"grammar-modal-meaning-q6","type":"meaning","scenarioJa":"週末の混雑がまだ分からない。","prompt":"“The museum might be busy on Saturday.” Which paraphrase fits?","choices":[{"text":"The museum is guaranteed to be empty.","feedbackJa":"空いている保証ではありません。"},{"text":"It is possible that the museum will be busy.","feedbackJa":"混雑する可能性を述べています。"},{"text":"The museum must close permanently.","feedbackJa":"永久閉館の話ではありません。"},{"text":"Visitors are forbidden to go on Saturday.","feedbackJa":"訪問禁止を示していません。"}],"correctIndex":1,"explanationJa":"mightは可能性を示す。固定した確率や確実な予測とはしない。","focusJa":"不確かな可能性"}],"domainIds":["education","science","travel"],"sourceReferences":[{"title":"Cambridge English Grammar Today: Shall","url":"https://dictionary.cambridge.org/us/grammar/british-grammar/shall"},{"title":"British Council LearnEnglish Teens: Have to, must and should","url":"https://learnenglishteens.britishcouncil.org/grammar/a1-a2-grammar/have-must-should-obligation-advice"},{"title":"British Council: Modals — deductions about the present","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/modals-deductions-about-present?page=1"}],"contentSha256":"6ea6f4b2ddbfa8cba7f8abb00433f66edc2bea7ac735d61125fe8a96b0488944","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_library_integration","reviewedAt":"2026-10-23T14:12:03.794Z","contentSha256":"6ea6f4b2ddbfa8cba7f8abb00433f66edc2bea7ac735d61125fe8a96b0488944"},"audio":{"status":"not-generated"}},{"id":"grammar-reported-speech","series":"grammar","titleJa":"人の発言を、視点を変えて伝える","levelTargets":["B1","B2","C1"],"goalJa":"読解の発言内容と話し手を追い、要約で代名詞・時制・時間表現を整える。","conceptJa":"間接話法は、人の言った内容を自分の文として伝える。時制を過去側に移すことが多いが、今も真実・有効な内容なら必ずしも移さない。誰が、いつ、どこから伝えるかを確認する。","commonTrapJa":"saidがあれば全て自動的に過去へ変更する、という機械的な変換にしない。代名詞と時間の指す先も大切。","usageNotes":["say that / say to someone thatとtell someone thatを使い分ける。通常said meとはしない。","間接疑問では、疑問詞などの後を主語＋動詞の語順にする。","tomorrowをthe next dayにするかなどは、元の発話時と報告時がいつかによる。"],"examples":[{"id":"grammar-reported-speech-ex1","text":"Maya said that she was preparing for the interview.","meaningJa":"マヤは面接の準備をしていると言いました。","contextJa":"マヤの当時の発言を伝える。"},{"id":"grammar-reported-speech-ex2","text":"Our teacher told us that clear examples would strengthen the essay.","meaningJa":"先生は、明確な例が作文の説得力を高めるだろうと私たちに言いました。","contextJa":"発言の受け手も述べる。"},{"id":"grammar-reported-speech-ex3","text":"Rina said that she lives near the station, so we can meet her there.","meaningJa":"リナは駅の近くに住んでいると言っていたので、そこで会えます。","contextJa":"今も有効な居住情報として伝える。"},{"id":"grammar-reported-speech-ex4","text":"He asked where the discussion would take place.","meaningJa":"彼は、話し合いがどこで行われるのか尋ねました。","contextJa":"質問の内容を文中に入れる。"}],"contrasts":[{"leftEnglish":"She said that she needed more time.","rightEnglish":"She told me that she needed more time.","noteJa":"tellにはここで発言の相手meが必要。sayはthat節に内容を続けられる。"},{"leftEnglish":"She said she was staying with her aunt.","rightEnglish":"She said she is staying with her aunt.","noteJa":"右は今も滞在していると捉える言い方として自然。左の過去形だけで、今は必ず滞在を終えたとは言えない。"}],"questions":[{"id":"grammar-reported-speech-q1","type":"context","scenarioJa":"先生が私たちに伝えた内容を、tellで報告する。","prompt":"The teacher ___ us that the deadline was Friday.","choices":[{"text":"said","feedbackJa":"通常said us thatとはせず、said to usまたはtold usにします。"},{"text":"spoke","feedbackJa":"spoke us thatという形にはしません。"},{"text":"told","feedbackJa":"told＋相手＋that節の形です。"},{"text":"talked","feedbackJa":"talked us thatという形にはしません。"}],"correctIndex":2,"explanationJa":"tell someone thatの形。sayならsaid to us thatなどとする。","focusJa":"sayとtell"},{"id":"grammar-reported-speech-q2","type":"meaning","scenarioJa":"リナの引っ越していないことを知っていて、居住地を伝える。","prompt":"“Rina said she lives near the station.” Is the present tense necessarily wrong?","choices":[{"text":"No; the location is being treated as still true.","feedbackJa":"今も有効な情報として現在形を使えます。"},{"text":"Yes; every verb after said must be past perfect.","feedbackJa":"全て過去完了にする規則ではありません。"},{"text":"Yes; people cannot report where someone lives.","feedbackJa":"居住地も間接話法で伝えられます。"},{"text":"No; lives is already a past-tense form.","feedbackJa":"livesは現在形です。"}],"correctIndex":0,"explanationJa":"今も真実・有効な内容は現在形のまま伝えることがある。","focusJa":"時制を変えない場合"},{"id":"grammar-reported-speech-q3","type":"context","scenarioJa":"討論会の場所を尋ねた内容を、間接疑問で報告する。","prompt":"She asked where ___.","choices":[{"text":"would the debate take place","feedbackJa":"間接疑問内では主語を助動詞の前に置きます。"},{"text":"did the debate would take place","feedbackJa":"didとwouldの形が重複しています。"},{"text":"the debate would took place","feedbackJa":"wouldの後は原形です。"},{"text":"the debate would take place","feedbackJa":"主語＋would＋原形の語順です。"}],"correctIndex":3,"explanationJa":"直接疑問Where would the debate take place?と違い、間接疑問はwhere the debate would take place。","focusJa":"間接疑問の語順"},{"id":"grammar-reported-speech-q4","type":"meaning","scenarioJa":"マヤが自分のノートについて“I have lost my notes”と言った。別の人がその発言を報告する。","prompt":"In “Maya said that she had lost her notes,” whose notes are referred to?","choices":[{"text":"The reporter’s notes, solely because the reporter says the sentence.","feedbackJa":"発言を報告する人のノートとは限りません。"},{"text":"Maya’s notes.","feedbackJa":"元のI/myがマヤを指します。"},{"text":"Every student’s notes.","feedbackJa":"全員のノートではありません。"},{"text":"No one’s notes; her has no reference.","feedbackJa":"herはマヤを受けています。"}],"correctIndex":1,"explanationJa":"語形だけでなく、元の話し手を追ってI/myをshe/herに変える。","focusJa":"代名詞の視点"},{"id":"grammar-reported-speech-q5","type":"context","scenarioJa":"月曜日、ケンは“I will submit it tomorrow”と言った。金曜日に、その発言を時制を後ろに移して報告する。","prompt":"Ken said on Monday that he ___ submit it the following day.","choices":[{"text":"has","feedbackJa":"has submitという形にはしません。"},{"text":"is","feedbackJa":"is submitという形にはしません。"},{"text":"would","feedbackJa":"willを過去側に移すwouldです。"},{"text":"did to","feedbackJa":"この助動詞の組み合わせは使えません。"}],"correctIndex":2,"explanationJa":"wouldは当時から見た未来。the following dayは月曜日の翌日、火曜日を指す。","focusJa":"当時から見た未来"},{"id":"grammar-reported-speech-q6","type":"meaning","scenarioJa":"発言を過去形で報告した文を読む。","prompt":"“She said she was staying with her aunt.” Does was alone prove that the stay has ended now?","choices":[{"text":"No; it can be backshift, and the current situation needs more context.","feedbackJa":"過去形は時制の移動の場合があり、終了は断定できません。"},{"text":"Yes; reported past forms always prove that a situation has ended.","feedbackJa":"終了を常に意味するわけではありません。"},{"text":"Yes; was means never in reported speech.","feedbackJa":"neverという意味にはなりません。"},{"text":"No; the sentence is necessarily about next century.","feedbackJa":"そのような未来の指定はありません。"}],"correctIndex":0,"explanationJa":"間接話法の過去形を、現在は必ず違うという意味に読み過ぎない。","focusJa":"時制から言える範囲"}],"domainIds":["education","communication","media"],"sourceReferences":[{"title":"British Council: Reported speech — statements","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/b1-b2/reported-speech-statements"},{"title":"British Council Singapore: How to use English reported speech","url":"https://www.britishcouncil.sg/blog/How-to-use-English-reported-speech"},{"title":"British Council LearnEnglish Teens: Reported speech","url":"https://learnenglishteens.britishcouncil.org/grammar/b1-b2-grammar/reported-speech"}],"contentSha256":"bdd21470f8e2fc4d97fffbe04237ea36ceefedb52f35978c52b75d726dd52c33","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/catalog_library_integration","reviewedAt":"2026-10-23T14:12:03.794Z","contentSha256":"bdd21470f8e2fc4d97fffbe04237ea36ceefedb52f35978c52b75d726dd52c33"},"audio":{"status":"not-generated"}},{"id":"prepositions-time-at-on-in","series":"prepositions","titleJa":"時刻・日付・期間を伝える at / on / in","levelTargets":["A2","B1","B2"],"goalJa":"試験日程や予定を正確に読み、開始時刻・日付・期間を区別する。","conceptJa":"at は時刻、on は曜日や日付、in は月・年・季節などに使うのが基本です。「点・面・中」というイメージは手がかりであり、すべての表現を決める規則ではありません。","commonTrapJa":"Friday morning のように曜日が付く朝は on。in two weeks は通常「2週間後」で、2週間の滞在期間とは違います。","usageNotes":["in the morning と on Monday morning をまとまりで覚えます。","at the weekend は主に英国、on the weekend は主に米国の自然な言い方です。","at night は夜の活動一般、in the night はある夜の間の出来事によく使います。文脈によって重なる場合もあります。"],"examples":[{"id":"prepositions-time-at-on-in-ex1","text":"The science talk starts at half past four.","meaningJa":"科学の講演は4時半に始まります。","contextJa":"開始時刻を案内する"},{"id":"prepositions-time-at-on-in-ex2","text":"Our final presentation is on Wednesday morning.","meaningJa":"最終発表は水曜の午前です。","contextJa":"曜日付きの時間帯"},{"id":"prepositions-time-at-on-in-ex3","text":"The exchange students will arrive in September.","meaningJa":"交換留学生は9月に到着します。","contextJa":"到着する月"},{"id":"prepositions-time-at-on-in-ex4","text":"I will send you my revised essay in two days.","meaningJa":"修正した作文を2日後に送ります。","contextJa":"今から先の時点"}],"contrasts":[{"leftEnglish":"We read in the evening.","rightEnglish":"We read on Thursday evening.","noteJa":"一般的な時間帯には in、曜日で特定した時間帯には on を使います。"},{"leftEnglish":"They will stay for three weeks.","rightEnglish":"They will return in three weeks.","noteJa":"for は滞在の長さ、in は通常、今から帰ってくるまでの時間を示します。"}],"questions":[{"id":"prepositions-time-at-on-in-q1","type":"context","scenarioJa":"討論会の開始は午後3時ちょうどです。","prompt":"The debate begins ___ 3 p.m.","choices":[{"text":"at","feedbackJa":"時刻を示す at が合います。"},{"text":"on","feedbackJa":"on は曜日・日付で使うのが基本です。"},{"text":"in","feedbackJa":"ここは月や時間帯ではなく時刻です。"},{"text":"for","feedbackJa":"開始時刻にはこの形の for は使いません。"}],"correctIndex":0,"explanationJa":"時計で示せる開始時刻には at。at 3 p.m. で「午後3時に」です。","focusJa":"時計の時刻"},{"id":"prepositions-time-at-on-in-q2","type":"context","scenarioJa":"試験は金曜の朝に始まります。","prompt":"The exam begins ___ Friday morning.","choices":[{"text":"in","feedbackJa":"曜日の付かない in the morning と区別します。"},{"text":"at","feedbackJa":"at はこの曜日付き表現には合いません。"},{"text":"on","feedbackJa":"曜日を含む朝には on を使います。"},{"text":"since","feedbackJa":"since は継続の起点などを表します。"}],"correctIndex":2,"explanationJa":"Friday が morning を特定しているので on Friday morning です。","focusJa":"曜日付きの時間帯"},{"id":"prepositions-time-at-on-in-q3","type":"meaning","scenarioJa":"先生の返事を待っています。","prompt":"What does “I will return your essay in a week” normally mean?","choices":[{"text":"The teacher will keep returning it for a whole week.","feedbackJa":"継続期間を述べた文ではありません。"},{"text":"The teacher expects to return it one week from now.","feedbackJa":"今から1週間後の予定です。"},{"text":"The teacher returned it a week ago.","feedbackJa":"過去の出来事ではありません。"},{"text":"The teacher will return it every week.","feedbackJa":"繰り返しの予定ではありません。"}],"correctIndex":1,"explanationJa":"未来の予定で in + 期間 は、通常「今からその期間がたった時」を表します。","focusJa":"in + 期間の未来の意味"},{"id":"prepositions-time-at-on-in-q4","type":"usage","scenarioJa":"英国と米国の友達が週末の予定を話しています。","prompt":"Which statement about “at the weekend” and “on the weekend” is accurate?","choices":[{"text":"Only “at the weekend” is standard English.","feedbackJa":"米国では on the weekend も一般的です。"},{"text":"Only “on the weekend” is standard English.","feedbackJa":"英国では at the weekend が一般的です。"},{"text":"They always refer to different days.","feedbackJa":"必ず別の日を指すわけではありません。"},{"text":"Both are standard; their frequency differs by variety.","feedbackJa":"地域差があり、どちらも自然に使われます。"}],"correctIndex":3,"explanationJa":"英米差のある表現を片方だけ誤りにしないことが大切です。曜日や時刻の違いではありません。","focusJa":"自然な地域差を認める"},{"id":"prepositions-time-at-on-in-q5","type":"intent","scenarioJa":"9月のどの日かは未定ですが、研修を始めます。","prompt":"Which sentence gives only the month of the planned start?","choices":[{"text":"The course starts in September.","feedbackJa":"開始する月だけを示しています。"},{"text":"The course starts on September 12.","feedbackJa":"具体的な日付まで指定しています。"},{"text":"The course starts at nine.","feedbackJa":"時刻を指定しています。"},{"text":"The course lasts for September and October.","feedbackJa":"開始だけでなく期間を述べています。"}],"correctIndex":0,"explanationJa":"in September は月を示します。on + 日付や at + 時刻と情報の細かさを区別しましょう。","focusJa":"予定の情報量"},{"id":"prepositions-time-at-on-in-q6","type":"meaning","scenarioJa":"夜の習慣と、昨夜の出来事を比べます。","prompt":"Which explanation is most accurate?","choices":[{"text":"“At night” always means midnight exactly.","feedbackJa":"真夜中ちょうどという意味ではありません。"},{"text":"“In the night” can only describe daytime.","feedbackJa":"夜の間の出来事に使えます。"},{"text":"“At night” often describes night-time generally; “in the night” can locate an event within a night.","feedbackJa":"一般的な夜と、その夜の中の出来事という違いです。"},{"text":"The two expressions can never overlap in use.","feedbackJa":"文脈によっては重なるので断定できません。"}],"correctIndex":2,"explanationJa":"決まり文句と文脈を一緒に読みます。イメージだけで絶対的な使い分けにしないようにしましょう。","focusJa":"一般的な時間帯と具体的な出来事"}],"domainIds":["education","daily-life"],"sourceReferences":[{"title":"British Council: Prepositions of time — at, in, on","url":"https://learnenglish.britishcouncil.org/grammar/a1-a2-grammar/prepositions-of-time-at-in-on"},{"title":"Cambridge English Grammar Today: For","url":"https://dictionary.cambridge.org/grammar/british-grammar/for"}],"contentSha256":"bec1e3d1c89a53d80efe5bb97f281adb5329691a672b817c8c24e269bddb4a54","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"bec1e3d1c89a53d80efe5bb97f281adb5329691a672b817c8c24e269bddb4a54"},"audio":{"status":"not-generated"}},{"id":"prepositions-place-at-on-in","series":"prepositions","titleJa":"場所をどの視点で示す？ at / on / in","levelTargets":["A2","B1","B2"],"goalJa":"場所を待ち合わせ地点・内部・表面として伝え分ける。","conceptJa":"at は地点や活動の場所、in は範囲の内部、on は表面への接触が基本の手がかりです。同じ建物でも話し手の視点で at と in の両方が自然になることがあります。","commonTrapJa":"at the library だけでは「建物の外」と断定できません。in the library は内部にいることをはっきり示します。","usageNotes":["at a conference は参加する活動の場を示せます。","完全な番地には at、都市など広い範囲には in が一般的です。","on an island や on a floor など、表面の図だけでは説明しきれない慣用もあります。"],"examples":[{"id":"prepositions-place-at-on-in-ex1","text":"Meet me at the east gate after the exam.","meaningJa":"試験後に東門で待ち合わせましょう。","contextJa":"待ち合わせ地点"},{"id":"prepositions-place-at-on-in-ex2","text":"The spare batteries are in the locked drawer.","meaningJa":"予備の電池は鍵のかかった引き出しの中です。","contextJa":"閉じた場所の内部"},{"id":"prepositions-place-at-on-in-ex3","text":"A blue sticker is on the cover of my notebook.","meaningJa":"ノートの表紙に青いシールが貼ってあります。","contextJa":"表面への接触"},{"id":"prepositions-place-at-on-in-ex4","text":"Several students asked questions at the climate conference.","meaningJa":"気候の会議で、何人かの生徒が質問しました。","contextJa":"活動が行われる場"}],"contrasts":[{"leftEnglish":"Mina is at the museum.","rightEnglish":"Mina is in the museum.","noteJa":"at はその場所にいるという捉え方、in は建物の内部を明示します。at から屋外だとは言えません。"},{"leftEnglish":"There is a label on the box.","rightEnglish":"There is a label in the box.","noteJa":"表面に貼られているのか、箱の中に入っているのかが変わります。"}],"questions":[{"id":"prepositions-place-at-on-in-q1","type":"context","scenarioJa":"鍵は袋の内側に入っていて、表面にも隣にもありません。","prompt":"The key is ___ the bag.","choices":[{"text":"on","feedbackJa":"表面にあるという意味になります。"},{"text":"in","feedbackJa":"内側に入っているという場面です。"},{"text":"beside","feedbackJa":"袋の隣という意味です。"},{"text":"under","feedbackJa":"袋の下という意味です。"}],"correctIndex":1,"explanationJa":"内部にあることを示す in を選びます。物の大きさではなく位置関係が手がかりです。","focusJa":"内部の位置"},{"id":"prepositions-place-at-on-in-q2","type":"context","scenarioJa":"観察用の容器の外側の表面に、印を付けます。","prompt":"Put a red mark ___ the outside surface of the container.","choices":[{"text":"in","feedbackJa":"ここでは表面への印で、内部ではありません。"},{"text":"under","feedbackJa":"表面の下ではありません。"},{"text":"behind","feedbackJa":"裏側という位置指定ではありません。"},{"text":"on","feedbackJa":"表面に印を付けるので on です。"}],"correctIndex":3,"explanationJa":"on the surface で表面上にあることを示します。","focusJa":"表面への接触"},{"id":"prepositions-place-at-on-in-q3","type":"meaning","scenarioJa":"友達から “I am at the library” と届きました。","prompt":"What can you safely understand from this message alone?","choices":[{"text":"The friend is definitely outside the building.","feedbackJa":"at だけでは屋外と断定できません。"},{"text":"The friend is definitely studying medicine.","feedbackJa":"学んでいる内容は分かりません。"},{"text":"The library is the friend’s stated location, but the exact spot is not given.","feedbackJa":"場所は分かりますが、内部のどこかまでは不明です。"},{"text":"The friend has never entered the library.","feedbackJa":"過去の行動は述べていません。"}],"correctIndex":2,"explanationJa":"at は場所を地点として示せます。建物の内外や部屋番号まで勝手に補わない読み方が大切です。","focusJa":"文から言えることの範囲"},{"id":"prepositions-place-at-on-in-q4","type":"context","scenarioJa":"通知書に、家の番地を含む正確な住所を書きます。","prompt":"She lives ___ 18 Willow Road.","choices":[{"text":"at","feedbackJa":"番地まで示した住所には at が自然です。"},{"text":"on","feedbackJa":"通りだけなら on を使えますが、この番地表現では at が基本です。"},{"text":"into","feedbackJa":"移動先の内部を表す形です。"},{"text":"through","feedbackJa":"通過を表し、住所には合いません。"}],"correctIndex":0,"explanationJa":"at + 番地を含む住所、in + 都市などを区別します。","focusJa":"正確な住所"},{"id":"prepositions-place-at-on-in-q5","type":"meaning","scenarioJa":"レポートに “I met two researchers at a conference” とあります。","prompt":"What does “at a conference” identify here?","choices":[{"text":"The surface on which the researchers stood.","feedbackJa":"物理的な表面の説明ではありません。"},{"text":"The event at which the meeting happened.","feedbackJa":"出会いが起きた催しを示しています。"},{"text":"The researchers’ permanent home.","feedbackJa":"居住地は示していません。"},{"text":"The date when the conference was cancelled.","feedbackJa":"中止や日付の情報はありません。"}],"correctIndex":1,"explanationJa":"at は住所だけでなく、出来事が起きた活動の場にも使います。","focusJa":"活動の場としての at"},{"id":"prepositions-place-at-on-in-q6","type":"intent","scenarioJa":"図書館の建物に入り、外ではなく中にいると明確に伝えたい場面です。","prompt":"Which message states this most explicitly?","choices":[{"text":"I am near the library.","feedbackJa":"近くにいるだけで、内部とは言えません。"},{"text":"I am by the library.","feedbackJa":"そばにいるという表現です。"},{"text":"I am going to the library.","feedbackJa":"向かっていることを述べています。"},{"text":"I am inside the library.","feedbackJa":"建物の内部と明示しています。"}],"correctIndex":3,"explanationJa":"in や inside は内部を示します。at も使える場面ですが、今回は内部であることを明確にする意図を選びます。","focusJa":"伝える意図で表現を選ぶ"}],"domainIds":["education","science","daily-life"],"sourceReferences":[{"title":"Cambridge English Grammar Today: At, on and in (place)","url":"https://dictionary.cambridge.org/grammar/british-grammar/at-on-and-in-place"}],"contentSha256":"e44854b48806f9d08039abfc6e2fafbdb49fa5d15f0ea6a565061f65eb3981e3","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"e44854b48806f9d08039abfc6e2fafbdb49fa5d15f0ea6a565061f65eb3981e3"},"audio":{"status":"not-generated"}},{"id":"prepositions-to-for","series":"prepositions","titleJa":"届け先・受益者・目的を分ける to / for","levelTargets":["A2","B1","B2"],"goalJa":"誰に届けるのか、誰のためなのか、何をする目的なのかを読み分ける。","conceptJa":"to は到達先や受け手、for は受益者・用途を示すことがあります。ただし動詞との組合せも重要です。動詞の前の to は不定詞で、前置詞の to と区別します。","commonTrapJa":"「〜のために」を常に for + 動詞の原形にしないこと。行動の目的は to + 動詞、道具の用途は for + 動名詞などで表せます。","usageNotes":["give/send something to someone と buy/make something for someone を例文ごと覚えます。","send it to the teacher は送付先、prepare it for the teacher は誰向けに準備するかを示します。","for + -ing は道具の用途などに使えますが、あらゆる目的表現で to 不定詞と置き換えられるわけではありません。"],"examples":[{"id":"prepositions-to-for-ex1","text":"I sent the survey results to our teacher.","meaningJa":"調査結果を先生に送りました。","contextJa":"情報の送付先"},{"id":"prepositions-to-for-ex2","text":"We made a large-print guide for visitors with poor eyesight.","meaningJa":"目が見えにくい来場者のために、大きな文字の案内を作りました。","contextJa":"使う人のために準備する"},{"id":"prepositions-to-for-ex3","text":"The class visited the river to collect water samples.","meaningJa":"クラスは水の試料を集めるために川を訪れました。","contextJa":"行動の目的"},{"id":"prepositions-to-for-ex4","text":"This narrow brush is for cleaning the tubes.","meaningJa":"この細いブラシは管を洗うためのものです。","contextJa":"道具の用途"}],"contrasts":[{"leftEnglish":"I wrote a letter to my brother.","rightEnglish":"I wrote a letter for my brother.","noteJa":"to は兄弟を宛先にする読み、for は兄弟のために・代わりに書く読みができます。"},{"leftEnglish":"We went outside to measure the temperature.","rightEnglish":"We used a sensor for measuring the temperature.","noteJa":"行動の目的と、道具の用途をそれぞれ違う形で表しています。"}],"questions":[{"id":"prepositions-to-for-q1","type":"intent","scenarioJa":"先生が宛先となるように、レポートをメールで送りました。","prompt":"Which sentence clearly identifies the teacher as the recipient?","choices":[{"text":"I received the report from the teacher.","feedbackJa":"先生から受け取ったことになります。"},{"text":"I sent the report about the teacher.","feedbackJa":"先生を話題にしたレポートという意味です。"},{"text":"I sent the report to the teacher.","feedbackJa":"to が送付先を示します。"},{"text":"I kept the report for the teacher.","feedbackJa":"先生のために保管したので、送ったとは言えません。"}],"correctIndex":2,"explanationJa":"send something to someone は送り先を示す形です。","focusJa":"送付先の to"},{"id":"prepositions-to-for-q2","type":"context","scenarioJa":"新入生が使えるように、案内冊子を作りました。","prompt":"We made a guide ___ new students.","choices":[{"text":"for","feedbackJa":"誰の役に立つためかを示します。"},{"text":"to","feedbackJa":"make a guide to + 人ではこの受益者の意味になりません。"},{"text":"from","feedbackJa":"新入生を材料や出所のように扱う形です。"},{"text":"into","feedbackJa":"変化先を表すため、意図に合いません。"}],"correctIndex":0,"explanationJa":"make something for someone で、その人のために作ることを表します。","focusJa":"受益者の for"},{"id":"prepositions-to-for-q3","type":"usage","scenarioJa":"データを比較する目的で、グラフを描きます。","prompt":"Which sentence states that purpose naturally?","choices":[{"text":"We drew a graph for compare the data.","feedbackJa":"for の直後に原形 compare は置けません。"},{"text":"We drew a graph to comparing the data.","feedbackJa":"目的の to 不定詞には原形を使います。"},{"text":"We drew a graph for to compare the data.","feedbackJa":"標準的なこの目的表現では for to と重ねません。"},{"text":"We drew a graph to compare the data.","feedbackJa":"目的を to + 原形で表せます。"}],"correctIndex":3,"explanationJa":"この to compare は不定詞です。「比較するために」という行動の目的を示します。","focusJa":"目的の to 不定詞"},{"id":"prepositions-to-for-q4","type":"context","scenarioJa":"このクリップは紙をまとめる用途のものです。","prompt":"This clip is for ___ loose pages together.","choices":[{"text":"hold","feedbackJa":"前置詞 for の後ではこの原形は使いません。"},{"text":"holding","feedbackJa":"用途を for + -ing で表しています。"},{"text":"held","feedbackJa":"ここでは過去形・過去分詞は合いません。"},{"text":"holds","feedbackJa":"主語のない三人称単数形は置けません。"}],"correctIndex":1,"explanationJa":"for holding ... は道具の用途を表します。to hold ... という別の形も可能ですが、空欄の前は for と決まっています。","focusJa":"固定された文型に合う形"},{"id":"prepositions-to-for-q5","type":"meaning","scenarioJa":"友達が “I wrote the email for Ken because his arm was in a cast” と言いました。","prompt":"What is the most likely meaning of “for Ken” here?","choices":[{"text":"Ken received the email and no one else could.","feedbackJa":"for だけで宛先は決まりません。"},{"text":"Ken wrote the email for the speaker.","feedbackJa":"書いた人が逆になっています。"},{"text":"The speaker wrote it on Ken’s behalf.","feedbackJa":"けがをした Ken の代わりに書いたという意味です。"},{"text":"The email was only about Ken’s hobbies.","feedbackJa":"内容の話題を示す for ではありません。"}],"correctIndex":2,"explanationJa":"for someone はその人のために、またはその人に代わってという読みができます。ここでは腕のけがが手がかりです。","focusJa":"for の代行の意味"},{"id":"prepositions-to-for-q6","type":"meaning","scenarioJa":"学校の案内文にある2つの to を比べます。","prompt":"Which explanation of “We walked to the pond to observe insects” is correct?","choices":[{"text":"The first “to” introduces a destination; the second introduces a purpose with a verb.","feedbackJa":"pond という名詞と observe という動詞を区別します。"},{"text":"Both uses introduce a person receiving a gift.","feedbackJa":"受け手の人は出てきません。"},{"text":"The first “to” must be replaced by “for”.","feedbackJa":"walked to the pond は自然な到達先の表現です。"},{"text":"Both uses are followed by nouns naming destinations.","feedbackJa":"observe は動詞です。"}],"correctIndex":0,"explanationJa":"最初は前置詞の to、後ろは目的を表す to 不定詞です。同じつづりでも働きが違います。","focusJa":"前置詞と不定詞を区別する"}],"domainIds":["education","communication","science"],"sourceReferences":[{"title":"Cambridge English Grammar Today: To","url":"https://dictionary.cambridge.org/grammar/british-grammar/to"},{"title":"Cambridge English Grammar Today: For","url":"https://dictionary.cambridge.org/grammar/british-grammar/for"}],"contentSha256":"ebf70ecb6e9cfb7f9e013e509ec006e8bbc34b3333bf1aa5d19ff654e95fb7a8","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"ebf70ecb6e9cfb7f9e013e509ec006e8bbc34b3333bf1aa5d19ff654e95fb7a8"},"audio":{"status":"not-generated"}},{"id":"prepositions-by-with","series":"prepositions","titleJa":"方法・道具・行為者を区別する by / with","levelTargets":["A2","B1","B2"],"goalJa":"実験手順や制作の説明で、誰が・何を使い・どう行ったかを伝える。","conceptJa":"by + -ing は方法、with + 道具 は使用した物を示せます。受動態の by は行為者を示すこともあります。「by は人、with は物」という単純な分け方ではありません。","commonTrapJa":"with my sister は姉妹と一緒に、by my sister は受動態などでは姉妹によって。人が続くから同じ意味とは限りません。","usageNotes":["連絡方法には by email などの慣用表現があります。","行為者は人に限りません。The roof was damaged by the storm. のように原因も示せます。","with は道具だけでなく、同行者や備えている物も示します。文全体で役割を判断します。"],"examples":[{"id":"prepositions-by-with-ex1","text":"We compared the samples by placing them under the same lamp.","meaningJa":"同じランプの下に置く方法で試料を比較しました。","contextJa":"実験の方法"},{"id":"prepositions-by-with-ex2","text":"Aya marked the starting line with a piece of chalk.","meaningJa":"Aya はチョークでスタートラインを引きました。","contextJa":"使用した道具"},{"id":"prepositions-by-with-ex3","text":"The poster was designed by the art club.","meaningJa":"そのポスターは美術部によってデザインされました。","contextJa":"制作した人たち"},{"id":"prepositions-by-with-ex4","text":"I checked the results with a classmate.","meaningJa":"クラスメートと一緒に結果を確認しました。","contextJa":"一緒に取り組む相手"}],"contrasts":[{"leftEnglish":"The model was built by Emi.","rightEnglish":"The model was built with wooden sticks.","noteJa":"by は作った人、with は使った材料を示しています。"},{"leftEnglish":"I solved the problem by drawing a diagram.","rightEnglish":"I drew the diagram with a ruler.","noteJa":"by は取り組んだ方法、with は具体的な道具です。"}],"questions":[{"id":"prepositions-by-with-q1","type":"context","scenarioJa":"温度を測る方法として、センサーを水に入れます。","prompt":"We measured the temperature ___ placing a sensor in the water.","choices":[{"text":"with","feedbackJa":"この動作の方法には by + -ing を使います。"},{"text":"by","feedbackJa":"どのように測ったかを示す形です。"},{"text":"to","feedbackJa":"この位置の to + placing は合いません。"},{"text":"from","feedbackJa":"方法ではなく出所などを示す語です。"}],"correctIndex":1,"explanationJa":"by placing ... で測定の方法を表します。","focusJa":"方法の by + -ing"},{"id":"prepositions-by-with-q2","type":"context","scenarioJa":"具体的な道具として定規を使います。","prompt":"Draw a straight line ___ a ruler.","choices":[{"text":"by","feedbackJa":"ここは行為者や交通手段ではなく道具です。"},{"text":"from","feedbackJa":"定規が線の出所だという意図ではありません。"},{"text":"into","feedbackJa":"定規の中への移動ではありません。"},{"text":"with","feedbackJa":"使う道具を with で示せます。"}],"correctIndex":3,"explanationJa":"with a ruler は、定規を使ってという意味です。","focusJa":"具体的な道具の with"},{"id":"prepositions-by-with-q3","type":"meaning","scenarioJa":"作品の説明に “The mural was painted by volunteers” とあります。","prompt":"What role do the volunteers have?","choices":[{"text":"They are the people who painted the mural.","feedbackJa":"受動態の by が行為者を示します。"},{"text":"They are the paint used on the wall.","feedbackJa":"人を材料として説明していません。"},{"text":"They are the wall beneath the painting.","feedbackJa":"場所を示していません。"},{"text":"They are necessarily the people who bought the mural.","feedbackJa":"購入したかどうかは分かりません。"}],"correctIndex":0,"explanationJa":"受動態の後の by volunteers は、描いた人を示しています。","focusJa":"受動態の行為者"},{"id":"prepositions-by-with-q4","type":"meaning","scenarioJa":"“I revised the essay with my teacher” という学習記録です。","prompt":"What does “with my teacher” most naturally tell you?","choices":[{"text":"The teacher was absent during the revision.","feedbackJa":"with はこの場面で一緒にいる相手を示します。"},{"text":"Only the teacher revised it while the speaker did nothing.","feedbackJa":"話し手の関与を否定する情報はありません。"},{"text":"The teacher took part in revising it with the speaker.","feedbackJa":"一緒に取り組んだ相手を示しています。"},{"text":"The essay was sent to the teacher by post.","feedbackJa":"送付方法の話ではありません。"}],"correctIndex":2,"explanationJa":"with + 人 は共同で取り組む相手を表せます。受動態の by + 人 とは役割が違います。","focusJa":"同行・共同作業の with"},{"id":"prepositions-by-with-q5","type":"meaning","scenarioJa":"紙で郵送する代わりに “Please send your answer by email” と案内されています。","prompt":"What does “by email” specify?","choices":[{"text":"The person who must write the answer.","feedbackJa":"回答を書く人ではなく送信方法を示します。"},{"text":"The communication method to use for sending the answer.","feedbackJa":"メールという連絡手段を指定しています。"},{"text":"The exact deadline for the answer.","feedbackJa":"by Friday などとは違い、期限を示していません。"},{"text":"The topic that the answer must discuss.","feedbackJa":"メールについて書くという話題の指定ではありません。"}],"correctIndex":1,"explanationJa":"連絡方法の by email はまとまりで覚えます。この by は締切や行為者ではなく手段を示します。","focusJa":"連絡手段の慣用表現"},{"id":"prepositions-by-with-q6","type":"usage","scenarioJa":"by は人にしか使えないと思い込んでいないか確認します。","prompt":"Which statement about “The fence was damaged by the wind” is accurate?","choices":[{"text":"It is wrong because “by” can only introduce people.","feedbackJa":"風などの原因も by で示せます。"},{"text":"It means the fence was next to the wind.","feedbackJa":"この受動態では場所の意味ではありません。"},{"text":"It means someone used the wind as a writing tool.","feedbackJa":"道具の説明ではありません。"},{"text":"The by-phrase identifies the cause of the damage.","feedbackJa":"損傷を起こした原因を示しています。"}],"correctIndex":3,"explanationJa":"by を「人」、with を「物」と丸暗記すると誤ります。受動態と原因の関係を読み取りましょう。","focusJa":"単純な人・物の規則を避ける"}],"domainIds":["science","education","arts-culture"],"sourceReferences":[{"title":"Cambridge English Grammar Today: By","url":"https://dictionary.cambridge.org/grammar/british-grammar/by"},{"title":"Cambridge English Grammar Today: With","url":"https://dictionary.cambridge.org/grammar/british-grammar/with"}],"contentSha256":"64c959366e1006ca20a487c6abf673ed9433b4c01d3344e8ae777e089902dfe7","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"64c959366e1006ca20a487c6abf673ed9433b4c01d3344e8ae777e089902dfe7"},"audio":{"status":"not-generated"}},{"id":"prepositions-since-for-during","series":"prepositions","titleJa":"起点・長さ・出来事の間：since / for / during","levelTargets":["A2","B1","B2"],"goalJa":"学習歴や調査の期間を、開始点・継続時間・出来事の枠に分けて説明する。","conceptJa":"since は継続の起点、for は長さ、during は出来事や期間の中で起きることを示します。during だけで、その出来事が期間中ずっと続いたとは限りません。","commonTrapJa":"during two hours と機械的に数値を置かず、長さなら for two hours。「授業中に」は during the lesson、節を続けるなら while we were studying です。","usageNotes":["現在までの継続は have lived ... since ... など、現在完了と組み合わせます。","for は過去・現在・未来の期間にも使え、現在完了専用ではありません。","during + 名詞句 と while + 主語・動詞 を区別します。"],"examples":[{"id":"prepositions-since-for-during-ex1","text":"I have kept a reading journal since April.","meaningJa":"4月から読書記録を付けています。","contextJa":"始めた時点から現在まで"},{"id":"prepositions-since-for-during-ex2","text":"The students observed the insects for forty minutes.","meaningJa":"生徒たちは40分間、昆虫を観察しました。","contextJa":"観察した長さ"},{"id":"prepositions-since-for-during-ex3","text":"The lights went out during the presentation.","meaningJa":"発表の途中で照明が消えました。","contextJa":"出来事が起きた時間の枠"},{"id":"prepositions-since-for-during-ex4","text":"We will borrow the equipment for three days.","meaningJa":"その機材を3日間借りる予定です。","contextJa":"未来の利用期間"}],"contrasts":[{"leftEnglish":"She has studied Spanish since January.","rightEnglish":"She has studied Spanish for six months.","noteJa":"since はいつから、for はどれだけの長さかを示します。"},{"leftEnglish":"He visited the town during the summer.","rightEnglish":"He stayed in the town for the summer.","noteJa":"during は夏という時間の枠、for はここでは夏の間の滞在期間を示します。"}],"questions":[{"id":"prepositions-since-for-during-q1","type":"context","scenarioJa":"昨年9月に始めて、今も毎週ボランティアを続けています。","prompt":"I have volunteered here ___ last September.","choices":[{"text":"for","feedbackJa":"September は期間の長さではなく起点です。"},{"text":"during","feedbackJa":"現在までの継続の起点を表す形ではありません。"},{"text":"since","feedbackJa":"開始点から今までの継続を示します。"},{"text":"until","feedbackJa":"終点ではなく始まった時点の話です。"}],"correctIndex":2,"explanationJa":"have volunteered ... since ... で、開始した時点から今までの継続を述べています。","focusJa":"継続の起点"},{"id":"prepositions-since-for-during-q2","type":"context","scenarioJa":"昨日の観察は開始から終了まで45分でした。","prompt":"The observation lasted ___ forty-five minutes.","choices":[{"text":"for","feedbackJa":"継続した時間の長さを表します。"},{"text":"since","feedbackJa":"長さではなく起点を示す語です。"},{"text":"during","feedbackJa":"ここで測っている長さには for を使います。"},{"text":"by","feedbackJa":"締切や変化量の表現ではありません。"}],"correctIndex":0,"explanationJa":"for forty-five minutes は観察が続いた長さです。for は過去の出来事にも使えます。","focusJa":"数値で示す期間"},{"id":"prepositions-since-for-during-q3","type":"meaning","scenarioJa":"“A phone rang during the lecture” という記録です。","prompt":"What does this sentence establish?","choices":[{"text":"The phone rang for the entire lecture.","feedbackJa":"during だけで全時間とは言えません。"},{"text":"The phone rang before the lecture began.","feedbackJa":"講演の時間内です。"},{"text":"The phone rang only after the lecture ended.","feedbackJa":"終了後という意味ではありません。"},{"text":"The ringing happened while the lecture was in progress.","feedbackJa":"講演中に起きたことを示します。"}],"correctIndex":3,"explanationJa":"during は出来事が起きた時間の枠を示します。鳴っていた長さはこの文からは分かりません。","focusJa":"during が保証しない情報"},{"id":"prepositions-since-for-during-q4","type":"usage","scenarioJa":"読書していた間に、外で雨が降り始めました。","prompt":"Which sentence connects the two clauses naturally?","choices":[{"text":"It began to rain during I was reading.","feedbackJa":"during の後にはこの形の節を直接置けません。"},{"text":"It began to rain while I was reading.","feedbackJa":"while の後に主語と動詞を続けられます。"},{"text":"It began to rain for I was reading.","feedbackJa":"同時進行を示す意図の表現になりません。"},{"text":"It began to rain by I was reading.","feedbackJa":"by の後にこの節は置けません。"}],"correctIndex":1,"explanationJa":"while I was reading は節です。during my reading session のように名詞句にすれば during も使えます。","focusJa":"名詞句と節の違い"},{"id":"prepositions-since-for-during-q5","type":"intent","scenarioJa":"調査員は冬のどこかで来ましたが、滞在期間は不明です。","prompt":"Which sentence gives that limited information?","choices":[{"text":"The researcher stayed for the whole winter.","feedbackJa":"冬の全期間という追加情報を含みます。"},{"text":"The researcher has stayed since winter began.","feedbackJa":"今までの継続を含みます。"},{"text":"The researcher visited during the winter.","feedbackJa":"冬の中で訪れたことだけを示します。"},{"text":"The researcher stayed for exactly ninety days.","feedbackJa":"滞在期間を具体的に決めています。"}],"correctIndex":2,"explanationJa":"期間の枠を示す during と、長さを明示する for を情報量で読み分けます。","focusJa":"不明な期間を勝手に補わない"},{"id":"prepositions-since-for-during-q6","type":"meaning","scenarioJa":"“The lab will use the room for two weeks” と書かれています。","prompt":"What does “for two weeks” describe?","choices":[{"text":"How long the planned use will last.","feedbackJa":"未来の利用期間の長さです。"},{"text":"The exact date when the room was built.","feedbackJa":"建設日ではありません。"},{"text":"A point two weeks after the room closes.","feedbackJa":"未来の一点を示す in とは違います。"},{"text":"The person who owns the room.","feedbackJa":"人のためにという for ではありません。"}],"correctIndex":0,"explanationJa":"for は長さを示すので、未来の予定にも自然に使えます。","focusJa":"時制に依存しない期間の for"}],"domainIds":["education","science","daily-life"],"sourceReferences":[{"title":"British Council: How long","url":"https://learnenglish.britishcouncil.org/free-resources/grammar/english-grammar-reference/how-long"},{"title":"Cambridge English Grammar Today: During or for?","url":"https://dictionary.cambridge.org/grammar/british-grammar/during-or-for"},{"title":"Cambridge English Grammar Today: Conjunctions — time","url":"https://dictionary.cambridge.org/grammar/british-grammar/conjunctions-time"}],"contentSha256":"66cfcb96277e67d8ed657d54d04a9f83f5fdaa3acd46b5aa55389bd3c390a156","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"66cfcb96277e67d8ed657d54d04a9f83f5fdaa3acd46b5aa55389bd3c390a156"},"audio":{"status":"not-generated"}},{"id":"prepositions-until-by","series":"prepositions","titleJa":"「まで」と「までに」を読み分ける until / by","levelTargets":["A2","B1","B2"],"goalJa":"提出期限・利用可能時間・開始制限を取り違えず、必要な行動を判断する。","conceptJa":"by はそれより遅くない締切、until は状態や動作が続く終点を表すのが基本です。not ... until は「その時までは起きない」となるため、否定の有無も見ます。","commonTrapJa":"Submit it by Friday は早く出してもよい一方、Do not submit it until Friday は金曜より前に出さないという指示です。","usageNotes":["by five は5時より前の完了も含みます。5時ちょうどだけを指定する at five と区別します。","stay/wait/remain open など、続く状態には until が使いやすい形です。","日付だけの締切は時刻が曖昧な場合があるため、実際の案内では by 5 p.m. on Friday のように明確にします。"],"examples":[{"id":"prepositions-until-by-ex1","text":"Please upload your essay by five on Friday.","meaningJa":"金曜の5時までに作文をアップロードしてください。","contextJa":"提出の締切"},{"id":"prepositions-until-by-ex2","text":"The study room will remain open until nine tonight.","meaningJa":"自習室は今夜9時まで開いています。","contextJa":"利用できる状態の終点"},{"id":"prepositions-until-by-ex3","text":"Do not turn the page until the recording stops.","meaningJa":"録音が止まるまではページをめくらないでください。","contextJa":"行動を始めてよい時点"},{"id":"prepositions-until-by-ex4","text":"By the time the discussion began, everyone had read the article.","meaningJa":"討論が始まる時には、全員がその記事を読んでいました。","contextJa":"別の出来事より先の完了"}],"contrasts":[{"leftEnglish":"Finish the experiment by four.","rightEnglish":"Continue the experiment until four.","noteJa":"完了の締切と、続ける終点の違いです。"},{"leftEnglish":"You may submit it by Monday.","rightEnglish":"You must not submit it until Monday.","noteJa":"前者は月曜より前も可能。後者は月曜より前の提出を禁止しています。"}],"questions":[{"id":"prepositions-until-by-q1","type":"intent","scenarioJa":"午後6時より早く到着してもよく、6時が最終期限です。","prompt":"Which instruction expresses that deadline?","choices":[{"text":"Arrive at six exactly.","feedbackJa":"6時ちょうどに限定しています。"},{"text":"Arrive by six.","feedbackJa":"6時以前の到着を含みます。"},{"text":"Do not arrive until six.","feedbackJa":"6時より前の到着を避ける指示です。"},{"text":"Wait until six before leaving home.","feedbackJa":"出発を待つ指示で、到着期限ではありません。"}],"correctIndex":1,"explanationJa":"by six は「遅くとも6時までに」。早めの到着を妨げません。","focusJa":"締切は早い完了を含む"},{"id":"prepositions-until-by-q2","type":"context","scenarioJa":"部屋を今から4時まで続けて使えますが、その時に退出します。","prompt":"You may keep using the room ___ four, but you must leave then.","choices":[{"text":"since","feedbackJa":"開始点を示す語ではこの未来の終点を表せません。"},{"text":"for","feedbackJa":"four という時刻は時間の長さではありません。"},{"text":"by","feedbackJa":"利用を続ける終点には until が合います。"},{"text":"until","feedbackJa":"使い続けられる終点を示しています。"}],"correctIndex":3,"explanationJa":"keep using という継続の終点を until four で示します。","focusJa":"状態が続く終点"},{"id":"prepositions-until-by-q3","type":"meaning","scenarioJa":"“The results were not announced until Tuesday” とあります。","prompt":"Which interpretation matches the sentence?","choices":[{"text":"The results were announced on Tuesday, not before.","feedbackJa":"否定と until によって、それ以前ではないと分かります。"},{"text":"The results were announced every day before Tuesday.","feedbackJa":"繰り返し発表したという意味ではありません。"},{"text":"The results had to be announced earlier than Tuesday.","feedbackJa":"火曜より前とは反対の内容です。"},{"text":"The results could never be announced.","feedbackJa":"永遠に発表しないという意味ではありません。"}],"correctIndex":0,"explanationJa":"not ... until は、その時になって初めて起きるという読みになります。","focusJa":"not ... until の読解"},{"id":"prepositions-until-by-q4","type":"meaning","scenarioJa":"“By the time I reached the classroom, the test had started” と言われました。","prompt":"What was already true when the speaker reached the classroom?","choices":[{"text":"The speaker had already completed the test.","feedbackJa":"話し手が解き終わったとは書かれていません。"},{"text":"The classroom had closed for the summer.","feedbackJa":"夏休みの情報はありません。"},{"text":"The test had begun.","feedbackJa":"到着時には試験開始済みです。"},{"text":"The teacher was waiting to start after the speaker left.","feedbackJa":"開始は到着より前です。"}],"correctIndex":2,"explanationJa":"by the time の後の出来事を基準に、それ以前の完了を読み取ります。","focusJa":"基準時点までの完了"},{"id":"prepositions-until-by-q5","type":"intent","scenarioJa":"作文は金曜から受け付けます。木曜以前には送らないでほしい場面です。","prompt":"Which instruction communicates the opening restriction?","choices":[{"text":"Submit it by Friday.","feedbackJa":"金曜までにという締切で、早い提出を許します。"},{"text":"Do not submit it until Friday.","feedbackJa":"金曜より前には提出しないという指示です。"},{"text":"Keep a copy until Friday.","feedbackJa":"コピーを保存する期間の指示です。"},{"text":"You submitted it on Friday.","feedbackJa":"過去の報告で、今後の制限ではありません。"}],"correctIndex":1,"explanationJa":"締切を伝える by と、早すぎる開始を避ける not ... until を区別します。","focusJa":"開始制限と締切の違い"},{"id":"prepositions-until-by-q6","type":"context","scenarioJa":"自習は8時まで続けてよく、その後8時10分までに部屋を空けます。","prompt":"You can study here ___ eight, but leave the room ___ ten past eight.","choices":[{"text":"by / until","feedbackJa":"継続の終点と退出の締切が逆です。"},{"text":"since / for","feedbackJa":"この2つの時刻には合いません。"},{"text":"for / since","feedbackJa":"長さと起点の指定ではありません。"},{"text":"until / by","feedbackJa":"学習の終点と退出の締切を区別できます。"}],"correctIndex":3,"explanationJa":"study の継続には until、leave の完了期限には by を使います。","focusJa":"2つの時間関係を同時に読む"}],"domainIds":["education","daily-life"],"sourceReferences":[{"title":"Cambridge English Grammar Today: Until","url":"https://dictionary.cambridge.org/grammar/british-grammar/until"},{"title":"Cambridge English Grammar Today: By","url":"https://dictionary.cambridge.org/grammar/british-grammar/by"}],"contentSha256":"10c4aaea05e670c5d5808e7f67a0752066ad60f143a7dee28a902574a761181e","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"10c4aaea05e670c5d5808e7f67a0752066ad60f143a7dee28a902574a761181e"},"audio":{"status":"not-generated"}},{"id":"prepositions-across-through-over","series":"prepositions","titleJa":"横切る・中を通る・越える across / through / over","levelTargets":["B1","B2"],"goalJa":"経路の描写や長文中の移動を、周囲の空間との関係で読み取る。","conceptJa":"across は一方から反対側、through は内部を通る経路、over は上方を越える動きなどを示します。橋を渡る意味などでは across と over が重なることもあります。","commonTrapJa":"across と over を常に正反対としないこと。空間のどこを通ったかを、地形や目的語と一緒に判断します。","usageNotes":["through a tunnel はトンネルの内部を通る経路です。","across the country は全国の多くの場所に広がる意味にもなります。","over には移動だけでなく、覆う・数値を超える意味もあるため、動詞と目的語を一緒に読みます。"],"examples":[{"id":"prepositions-across-through-over-ex1","text":"We walked across the courtyard to the science building.","meaningJa":"中庭を横切って理科棟へ歩きました。","contextJa":"一方から反対側へ"},{"id":"prepositions-across-through-over-ex2","text":"The cycle path goes through a short tunnel.","meaningJa":"その自転車道は短いトンネルの中を通ります。","contextJa":"内部を通る経路"},{"id":"prepositions-across-through-over-ex3","text":"A bird flew over the fence and landed beside the pond.","meaningJa":"鳥は柵の上を越えて飛び、池のそばに降りました。","contextJa":"上方を越える動き"},{"id":"prepositions-across-through-over-ex4","text":"Schools across the region shared their survey results.","meaningJa":"地域の各地の学校が調査結果を共有しました。","contextJa":"広い範囲への分布"}],"contrasts":[{"leftEnglish":"The path runs through the hill in a tunnel.","rightEnglish":"The path runs over the hill.","noteJa":"内部を貫く経路なのか、丘の上を越える経路なのかが変わります。"},{"leftEnglish":"We walked across the footbridge to the opposite bank.","rightEnglish":"We walked over the footbridge to the opposite bank.","noteJa":"歩道橋を渡って反対岸へ行く文脈では両方が自然です。over が常に橋の上空を飛ぶことを意味するわけではありません。"}],"questions":[{"id":"prepositions-across-through-over-q1","type":"context","scenarioJa":"歩行者はトンネルに入り、内部を通って向こう側に出ました。","prompt":"The walkers went ___ the tunnel.","choices":[{"text":"above","feedbackJa":"上空の経路ではありません。"},{"text":"beside","feedbackJa":"トンネルの横を通ったのではありません。"},{"text":"through","feedbackJa":"内部を通過する経路です。"},{"text":"past","feedbackJa":"入口などを通り過ぎただけではありません。"}],"correctIndex":2,"explanationJa":"周囲をトンネルに囲まれた経路を through で表します。","focusJa":"内部を通る経路"},{"id":"prepositions-across-through-over-q2","type":"context","scenarioJa":"船は川のこちら側の岸から、反対側の岸へ進みました。","prompt":"The boat carried the students ___ the river.","choices":[{"text":"across","feedbackJa":"一方の岸から反対岸への移動です。"},{"text":"along","feedbackJa":"川に沿って進む別の経路です。"},{"text":"into","feedbackJa":"川に入ることだけを示します。"},{"text":"under","feedbackJa":"川の下を通る場面ではありません。"}],"correctIndex":0,"explanationJa":"across は両側のあるものを横切る経路を表せます。","focusJa":"反対側への移動"},{"id":"prepositions-across-through-over-q3","type":"intent","scenarioJa":"鳥は柵に開いた穴を通らず、柵の高さより上を通過しました。","prompt":"Which description matches the route?","choices":[{"text":"The bird flew through a hole in the fence.","feedbackJa":"穴の内部を通る別の経路です。"},{"text":"The bird stayed beside the fence.","feedbackJa":"移動して越えたことを述べていません。"},{"text":"The bird landed inside the fence post.","feedbackJa":"柵の柱の内部という別の場所です。"},{"text":"The bird flew over the fence.","feedbackJa":"柵の上を越える経路を示しています。"}],"correctIndex":3,"explanationJa":"この場面では高さが重要なので over。through は内部を通る別の経路になります。","focusJa":"高さを越える動き"},{"id":"prepositions-across-through-over-q4","type":"meaning","scenarioJa":"教育の記事に “libraries across the country” とあります。","prompt":"What does “across the country” mean here?","choices":[{"text":"Only one library at the national border.","feedbackJa":"一つの国境沿いの図書館だけではありません。"},{"text":"Libraries in many parts of the country.","feedbackJa":"国内の各地への広がりを示します。"},{"text":"Libraries travelling on a train.","feedbackJa":"建物が移動している意味ではありません。"},{"text":"Only libraries under the ground.","feedbackJa":"地下という位置の説明ではありません。"}],"correctIndex":1,"explanationJa":"across は移動以外に、地域内の分布や広がりも表します。","focusJa":"分布の across"},{"id":"prepositions-across-through-over-q5","type":"usage","scenarioJa":"川にかかった歩道橋を渡り、反対岸へ歩いて行くという場面です。","prompt":"How should you judge “walk across the footbridge” and “walk over the footbridge”?","choices":[{"text":"“Over” must mean flying above the bridge.","feedbackJa":"橋を歩いて渡る意味でも使えます。"},{"text":"“Across” always means staying at the starting point.","feedbackJa":"反対側への移動を表せます。"},{"text":"Both can describe crossing the bridge; context matters.","feedbackJa":"この文脈では両方が自然です。"},{"text":"Neither can describe walking.","feedbackJa":"どちらも歩く動作と組み合わせられます。"}],"correctIndex":2,"explanationJa":"橋を渡る場面では across と over が使えます。どんな場所でも常に交換できるという規則にはせず、経路と対象を一緒に読みます。","focusJa":"自然な代替表現を認める"},{"id":"prepositions-across-through-over-q6","type":"meaning","scenarioJa":"“The road goes through the forest” と案内されています。","prompt":"Which feature of the route is highlighted?","choices":[{"text":"The route passes within the forest.","feedbackJa":"森の内部を進む点が示されています。"},{"text":"The route remains far outside the forest.","feedbackJa":"内部という意味と合いません。"},{"text":"The route travels above every treetop.","feedbackJa":"木々の上空とは述べていません。"},{"text":"The route ends before reaching any trees.","feedbackJa":"森に入らないという意味ではありません。"}],"correctIndex":0,"explanationJa":"through は、森や群衆など周囲にものがある場所の内部を通る経路にも使えます。","focusJa":"空間の内部に注目する"}],"domainIds":["travel","transport","environment","education"],"sourceReferences":[{"title":"Cambridge English Grammar Today: Across, over or through?","url":"https://dictionary.cambridge.org/grammar/british-grammar/across"},{"title":"Cambridge English Grammar Today: Over","url":"https://dictionary.cambridge.org/grammar/british-grammar/over"},{"title":"Cambridge Dictionary: over — across from one side to the other","url":"https://dictionary.cambridge.org/us/dictionary/english/over"}],"contentSha256":"a30475c6ccd63b506bf5442b45ca522dd98c0af8fe4b9e50441e18eeccdcb9be","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"a30475c6ccd63b506bf5442b45ca522dd98c0af8fe4b9e50441e18eeccdcb9be"},"audio":{"status":"not-generated"}},{"id":"prepositions-between-among","series":"prepositions","titleJa":"個別の関係と集団の中：between / among","levelTargets":["B1","B2","C1"],"goalJa":"人数だけに頼らず、境界・個別の関係・集団への所属を読み分ける。","conceptJa":"between は区別できる対象どうしの関係や間、among は集団の一員・集団に囲まれた状態などに使います。「2つなら between、3つ以上なら必ず among」という規則ではありません。","commonTrapJa":"between the three regions のような形も自然です。分配などでは between と among の両方が可能な場合があり、数だけで一方を誤答にしません。","usageNotes":["between A and B は2つの対象の間を明確に示します。","among the finalists は決勝進出者という集団に含まれることを示します。","個別の境界や相互関係には、対象が3つ以上でも between を使えます。"],"examples":[{"id":"prepositions-between-among-ex1","text":"A narrow path runs between the library and the gym.","meaningJa":"図書館と体育館の間に細い道があります。","contextJa":"区別できる2つの建物の間"},{"id":"prepositions-between-among-ex2","text":"The agreement between the three schools covers shared equipment.","meaningJa":"3校間の協定は機材の共同利用を扱っています。","contextJa":"3つの学校それぞれの関係"},{"id":"prepositions-between-among-ex3","text":"Our school was among the finalists in the science contest.","meaningJa":"私たちの学校は科学コンテストの決勝進出校の一つでした。","contextJa":"集団の一員"},{"id":"prepositions-between-among-ex4","text":"I found my notes among a pile of old worksheets.","meaningJa":"古いプリントの山の中に、自分のノートを見つけました。","contextJa":"まとまりの中に混じる"}],"contrasts":[{"leftEnglish":"There are strong links between the three schools.","rightEnglish":"There is excitement among the students.","noteJa":"学校どうしの個別の関係と、生徒の集団内にある雰囲気を区別しています。"},{"leftEnglish":"The money was divided between the four clubs.","rightEnglish":"The money was divided among the four clubs.","noteJa":"分配の場面では両方が可能です。4団体という数だけで between を排除しません。"}],"questions":[{"id":"prepositions-between-among-q1","type":"context","scenarioJa":"2つの指定された建物に挟まれた位置にあります。","prompt":"The garden lies ___ the hall and the library.","choices":[{"text":"among","feedbackJa":"2つを個別に挙げてその間を示す形では between を使います。"},{"text":"between","feedbackJa":"hall と library の間という位置です。"},{"text":"through","feedbackJa":"通過経路の説明ではありません。"},{"text":"during","feedbackJa":"時間の表現ではありません。"}],"correctIndex":1,"explanationJa":"between A and B で、区別できる2つのものの間を示します。","focusJa":"2つの対象の間"},{"id":"prepositions-between-among-q2","type":"meaning","scenarioJa":"“Mai was among the students selected for the exchange” とあります。","prompt":"What is established about Mai?","choices":[{"text":"She selected every other student herself.","feedbackJa":"選考を担当したとは書かれていません。"},{"text":"She was the only student selected.","feedbackJa":"唯一とは述べていません。"},{"text":"She was standing exactly between two desks.","feedbackJa":"物理的な位置ではありません。"},{"text":"She was one of the selected students.","feedbackJa":"選ばれた集団に含まれています。"}],"correctIndex":3,"explanationJa":"among は集団の一員であることも表します。","focusJa":"所属・包含の among"},{"id":"prepositions-between-among-q3","type":"usage","scenarioJa":"3つの地域それぞれの協力関係を論じる作文です。","prompt":"Which claim about “cooperation between the three regions” is accurate?","choices":[{"text":"It can be natural because the regions are treated as distinct parties.","feedbackJa":"個別の相手どうしの関係として自然です。"},{"text":"It is always wrong because there are three regions.","feedbackJa":"3つ以上でも between を使えます。"},{"text":"It means only two regions exist.","feedbackJa":"対象の数を2つに変える意味ではありません。"},{"text":"It describes a region inside a single person.","feedbackJa":"相互関係の表現です。"}],"correctIndex":0,"explanationJa":"between を2つだけに限定する暗記法は不十分です。別々に捉えた当事者間の関係を示せます。","focusJa":"3つ以上に使う between"},{"id":"prepositions-between-among-q4","type":"meaning","scenarioJa":"“A few damaged pages were hidden among the documents” とあります。","prompt":"Where were the damaged pages?","choices":[{"text":"Outside the building where the documents were kept.","feedbackJa":"建物の外とは書かれていません。"},{"text":"At a time earlier than the documents were written.","feedbackJa":"時間関係ではありません。"},{"text":"Within the collection of documents.","feedbackJa":"書類のまとまりの中に混じっていました。"},{"text":"Exactly halfway between two named cities.","feedbackJa":"都市間の位置ではありません。"}],"correctIndex":2,"explanationJa":"among は書類などの集団・まとまりの中にも使えます。","focusJa":"まとまりの中に混じる"},{"id":"prepositions-between-among-q5","type":"usage","scenarioJa":"助成金を4つの部活動に分けたという同じ状況です。","prompt":"Which judgment is appropriate?","choices":[{"text":"“Divided between four clubs” must be rejected solely because there are four.","feedbackJa":"数だけでは誤りと判断できません。"},{"text":"Both “divided between four clubs” and “divided among four clubs” can be natural.","feedbackJa":"分配では両方を使える場合があります。"},{"text":"“Among” means that none of the clubs received money.","feedbackJa":"受け取らなかったという意味ではありません。"},{"text":"“Between” changes four clubs into two clubs.","feedbackJa":"対象の数を変える語ではありません。"}],"correctIndex":1,"explanationJa":"同じ意味で自然な選択肢を無理に対立させません。分配では両方が可能です。","focusJa":"複数の自然な表現"},{"id":"prepositions-between-among-q6","type":"meaning","scenarioJa":"学校間の協力を論じる文章に “boundaries between the districts” とあります。","prompt":"What relation does “between” identify?","choices":[{"text":"The number of residents inside each house.","feedbackJa":"住民の数ではありません。"},{"text":"The mood shared by all students.","feedbackJa":"集団の気分ではありません。"},{"text":"The dates when every district was founded.","feedbackJa":"設立の日付ではありません。"},{"text":"The lines separating one district from another.","feedbackJa":"個別の地区を隔てる境界です。"}],"correctIndex":3,"explanationJa":"地区がいくつあっても、個別の地区を分ける境界として between を使えます。","focusJa":"個別の境界関係"}],"domainIds":["education","society","politics"],"sourceReferences":[{"title":"MLA Style Center: Choosing Between","url":"https://style.mla.org/choosing-between/"},{"title":"Cambridge Dictionary: between","url":"https://dictionary.cambridge.org/dictionary/english/between"}],"contentSha256":"042834727266734cea68be6a16c7e5516e2f78e3c3743dc716552df807ceaebf","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"042834727266734cea68be6a16c7e5516e2f78e3c3743dc716552df807ceaebf"},"audio":{"status":"not-generated"}},{"id":"prepositions-above-over-below-under","series":"prepositions","titleJa":"上下・覆う関係・基準値：above / over / below / under","levelTargets":["B1","B2","C1"],"goalJa":"位置と数値の比較を読み分け、図表や説明文を正確に理解する。","conceptJa":"above/below は基準より高い・低い関係、over/under は上下関係に加えて覆う・隠れる関係にも使えます。位置関係では意味が重なることもあり、図のイメージだけで唯一の正解にはできません。","commonTrapJa":"over には「上方」だけでなく「覆って」「数値を超えて」もあります。above average は「平均より上」であり「全員より上」ではありません。","usageNotes":["数値や基準との比較では above average / below average のようなまとまりを使います。","under eighteen は18歳未満です。人数を数える over sixty responses は60件を超えることを表し、ちょうど60件は含みません。","put a cover over ... は覆う関係です。above ... としただけでは接触や被覆は示せません。"],"examples":[{"id":"prepositions-above-over-below-under-ex1","text":"A small window is above the classroom door.","meaningJa":"教室のドアより高い位置に小さな窓があります。","contextJa":"高さの位置関係"},{"id":"prepositions-above-over-below-under-ex2","text":"We put a cloth over the model to keep off the dust.","meaningJa":"ほこりを防ぐために模型に布をかぶせました。","contextJa":"覆う関係"},{"id":"prepositions-above-over-below-under-ex3","text":"The blue line falls below the predicted value.","meaningJa":"青い線は予測値より下になります。","contextJa":"グラフの基準との比較"},{"id":"prepositions-above-over-below-under-ex4","text":"The class finished the practice test in under twenty minutes.","meaningJa":"クラスは20分未満で練習テストを終えました。","contextJa":"時間が上限に届かない"}],"contrasts":[{"leftEnglish":"A cloth hangs above the display.","rightEnglish":"A cloth lies over the display.","noteJa":"前者は上方の位置、後者は展示を覆う読みになります。高さだけでは覆っているとは言えません。"},{"leftEnglish":"The score was below the class average.","rightEnglish":"The score was under fifty.","noteJa":"平均という基準と、50という具体的な数値の上限を、それぞれ比較しています。"}],"questions":[{"id":"prepositions-above-over-below-under-q1","type":"intent","scenarioJa":"模型をほこりから守るため、布で覆います。","prompt":"Which instruction clearly asks someone to cover the model?","choices":[{"text":"Put a cloth over the model.","feedbackJa":"布をかぶせて覆う意図です。"},{"text":"Hang a cloth far above the model.","feedbackJa":"離れた上方では覆う指示と異なります。"},{"text":"Place the model beside a cloth.","feedbackJa":"模型の隣に布があるだけです。"},{"text":"Remove the cloth from the model.","feedbackJa":"覆いを取り外す反対の行動です。"}],"correctIndex":0,"explanationJa":"over は覆う関係を表せます。above は上方の位置を示しても、覆うことまでは保証しません。","focusJa":"覆う over"},{"id":"prepositions-above-over-below-under-q2","type":"meaning","scenarioJa":"摂氏で測った温度の記録に “three degrees below zero” とあります。","prompt":"Which value is described?","choices":[{"text":"3°C","feedbackJa":"ゼロより上の値です。"},{"text":"0°C","feedbackJa":"ゼロそのものではありません。"},{"text":"−3°C","feedbackJa":"摂氏ゼロ度より3度低い値です。"},{"text":"30°C","feedbackJa":"桁も上下関係も違います。"}],"correctIndex":2,"explanationJa":"below zero はゼロより低いことを示します。ここでは摂氏の温度なので −3°C です。基準・差・単位を一緒に読みます。","focusJa":"基準値より低い"},{"id":"prepositions-above-over-below-under-q3","type":"meaning","scenarioJa":"参加条件は “students under eighteen” です。年齢以外の条件は考えません。","prompt":"Which student meets this age condition?","choices":[{"text":"A student who is eighteen.","feedbackJa":"18歳ちょうどは未満に含まれません。"},{"text":"A student who is seventeen.","feedbackJa":"18歳未満なので年齢条件を満たします。"},{"text":"A student who is nineteen.","feedbackJa":"18歳を超えています。"},{"text":"A student who is twenty.","feedbackJa":"18歳未満ではありません。"}],"correctIndex":1,"explanationJa":"under eighteen は18歳未満です。「以下」と読み替えないようにします。","focusJa":"未満と以下の区別"},{"id":"prepositions-above-over-below-under-q4","type":"meaning","scenarioJa":"調査報告に “over sixty responses” とあります。","prompt":"Which number is consistent with that description?","choices":[{"text":"Exactly sixty.","feedbackJa":"ちょうど60は「60を超える」に含まれません。"},{"text":"Fifty-nine.","feedbackJa":"60に届いていません。"},{"text":"Six.","feedbackJa":"数の大きさが違います。"},{"text":"Sixty-one.","feedbackJa":"60を超えています。"}],"correctIndex":3,"explanationJa":"数の前の over は more than を表せます。上下の位置ではありません。","focusJa":"数値を超える over"},{"id":"prepositions-above-over-below-under-q5","type":"meaning","scenarioJa":"図には “The shelf is above the desk” とだけ書かれています。","prompt":"Which conclusion is justified by “above” alone?","choices":[{"text":"The shelf is at a higher level than the desk.","feedbackJa":"高い位置にあることを示します。"},{"text":"The shelf is touching the desktop.","feedbackJa":"接触は保証されません。"},{"text":"The shelf completely covers the desk.","feedbackJa":"覆っているとは限りません。"},{"text":"The shelf is lower than the desk.","feedbackJa":"上下が逆です。"}],"correctIndex":0,"explanationJa":"above は高さの関係を示します。接触や覆う範囲までは読み足しません。","focusJa":"位置表現からの過剰な推測を避ける"},{"id":"prepositions-above-over-below-under-q6","type":"meaning","scenarioJa":"作文の評価について “Your score is above the class average” と言われました。","prompt":"What does this statement actually tell you?","choices":[{"text":"The score is the highest in the class.","feedbackJa":"平均より上でも最高とは限りません。"},{"text":"Every other student received the same score.","feedbackJa":"他の点数の分布は分かりません。"},{"text":"The score is higher than the class mean.","feedbackJa":"クラス平均を上回っています。"},{"text":"The score is lower than the class mean.","feedbackJa":"above と反対の意味です。"}],"correctIndex":2,"explanationJa":"比較基準は average です。最高点・合格点など別の基準と混同しないことが読解でも重要です。","focusJa":"比較の基準を保つ"}],"domainIds":["education","science","logic-reasoning"],"sourceReferences":[{"title":"Cambridge English Grammar Today: Above or over? (publisher excerpt)","url":"https://assets.cambridge.org/97805217/31751/excerpt/9780521731751_excerpt.pdf"},{"title":"Cambridge English Grammar Today: Below","url":"https://dictionary.cambridge.org/grammar/british-grammar/below"},{"title":"Cambridge English Grammar Today: Over","url":"https://dictionary.cambridge.org/grammar/british-grammar/over"},{"title":"Cambridge English Grammar Today: Under","url":"https://dictionary.cambridge.org/grammar/british-grammar/under"}],"contentSha256":"050bd75d642dfc876448ba2fb76242f05346876c07e7cb517254ce38b0c55c89","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"050bd75d642dfc876448ba2fb76242f05346876c07e7cb517254ce38b0c55c89"},"audio":{"status":"not-generated"}},{"id":"prepositions-about-on","series":"prepositions","titleJa":"話題と専門的なテーマ：about / on","levelTargets":["B1","B2","C1"],"goalJa":"話題を伝える表現を選び、動詞の型と文章の調子にも注意する。","conceptJa":"about と on はどちらも話題を示せます。on は専門的・焦点を絞った論述でよく使われますが、about が誤りになるわけではありません。組み合わせる名詞や動詞によって選び方が変わります。","commonTrapJa":"discuss the issue は自然ですが、標準的なこの他動詞の型に about を足しません。talk about the issue とは型が異なります。","usageNotes":["a book about ... と a paper on ... の傾向を知りつつ、常に排他的なルールにはしません。","worry about ... や excited about ... は語の組合せとして覚えます。","about fifty は「約50」という数量の表現で、話題を示す前置詞の用法とは区別します。"],"examples":[{"id":"prepositions-about-on-ex1","text":"We talked about the problems caused by food waste.","meaningJa":"食品廃棄が引き起こす問題について話しました。","contextJa":"会話の話題"},{"id":"prepositions-about-on-ex2","text":"The class read a research paper on urban bird populations.","meaningJa":"クラスは都市の鳥の個体数に関する研究論文を読みました。","contextJa":"焦点を絞った専門テーマ"},{"id":"prepositions-about-on-ex3","text":"I am worried about the reliability of this source.","meaningJa":"この情報源が信頼できるか心配しています。","contextJa":"心配の対象"},{"id":"prepositions-about-on-ex4","text":"The essay discusses several ways to reduce packaging.","meaningJa":"その作文は包装を減らすいくつかの方法を論じています。","contextJa":"discuss の目的語を直接続ける"}],"contrasts":[{"leftEnglish":"We read a book about ocean life.","rightEnglish":"We read a paper on coral reproduction.","noteJa":"一般的な話題と専門的な焦点という傾向がありますが、about/on の交換が常に不可能という意味ではありません。"},{"leftEnglish":"We talked about the results.","rightEnglish":"We discussed the results.","noteJa":"talk about + 話題 と discuss + 目的語。動詞に合わせて前置詞の有無が変わります。"}],"questions":[{"id":"prepositions-about-on-q1","type":"usage","scenarioJa":"標準的な英作文で、交通政策について論じたと書きたい場面です。","prompt":"Which sentence uses “discuss” in its standard transitive pattern?","choices":[{"text":"We discussed about the transport policy.","feedbackJa":"この型では about を足しません。"},{"text":"We discussed the transport policy.","feedbackJa":"discuss の直後に目的語を置けます。"},{"text":"We discussed on the transport policy.","feedbackJa":"この型では on を足しません。"},{"text":"We discussed to the transport policy.","feedbackJa":"政策を to の相手にする形ではありません。"}],"correctIndex":1,"explanationJa":"discuss something と talk about something をそれぞれの型で覚えます。","focusJa":"動詞ごとの前置詞の有無"},{"id":"prepositions-about-on-q2","type":"context","scenarioJa":"参考文献の信頼性を心配しています。","prompt":"I am worried ___ the accuracy of the report.","choices":[{"text":"to","feedbackJa":"この worried の対象には about を使います。"},{"text":"on","feedbackJa":"専門テーマの on を機械的に移せません。"},{"text":"into","feedbackJa":"移動の意味ではありません。"},{"text":"about","feedbackJa":"心配している対象を表します。"}],"correctIndex":3,"explanationJa":"worried about ... をまとまりとして使います。どの語の後かも大切です。","focusJa":"worried about の組合せ"},{"id":"prepositions-about-on-q3","type":"usage","scenarioJa":"レポートの題材は学校給食です。","prompt":"Which claim about “a report on school meals” and “a report about school meals” is most accurate?","choices":[{"text":"Both can be natural; “on” often suggests a focused treatment of the subject.","feedbackJa":"両方が可能で、on には焦点を絞る傾向があります。"},{"text":"“About” is always wrong in every academic text.","feedbackJa":"学術的文章でも about は使えます。"},{"text":"“On” always means the report is physically lying on food.","feedbackJa":"ここでは話題を示す読みです。"},{"text":"The two phrases necessarily name different school subjects.","feedbackJa":"必ず題材が違うわけではありません。"}],"correctIndex":0,"explanationJa":"文体の傾向と文法的な可否は別です。自然な about を単純に誤答にしません。","focusJa":"傾向と絶対規則の違い"},{"id":"prepositions-about-on-q4","type":"meaning","scenarioJa":"“The lecture on renewable energy attracted many students” とあります。","prompt":"What is the function of “on renewable energy”?","choices":[{"text":"It gives the exact date of the lecture.","feedbackJa":"日付ではありません。"},{"text":"It identifies the surface supporting the speaker.","feedbackJa":"物理的な表面ではありません。"},{"text":"It identifies the subject of the lecture.","feedbackJa":"講演のテーマを示しています。"},{"text":"It states how long the lecture lasted.","feedbackJa":"継続時間ではありません。"}],"correctIndex":2,"explanationJa":"on は表面だけでなく、講演や文章のテーマにも使われます。","focusJa":"話題を示す on"},{"id":"prepositions-about-on-q5","type":"meaning","scenarioJa":"アンケートの説明に “About eighty students replied” とあります。","prompt":"What does “about eighty” mean?","choices":[{"text":"Exactly eight students.","feedbackJa":"数も正確さも違います。"},{"text":"Approximately eighty students.","feedbackJa":"約80人という概数です。"},{"text":"A discussion concerning the number eighty.","feedbackJa":"話題の about ではありません。"},{"text":"More than eight hundred students.","feedbackJa":"桁を増やす意味ではありません。"}],"correctIndex":1,"explanationJa":"数量の前の about は「およそ」。同じ語でも文中の働きが変わります。","focusJa":"概数の about"},{"id":"prepositions-about-on-q6","type":"intent","scenarioJa":"2人の生徒が昼休みに、進路の希望について話しました。","prompt":"Which sentence states that conversation naturally?","choices":[{"text":"They talked the careers they hoped to pursue.","feedbackJa":"この話題を直接目的語にする型は合いません。"},{"text":"They talked to the careers they hoped to pursue.","feedbackJa":"話しかける相手として careers は合いません。"},{"text":"They talked into the careers they hoped to pursue.","feedbackJa":"このままでは意図した話題表現になりません。"},{"text":"They talked about the careers they hoped to pursue.","feedbackJa":"会話の話題を about で示しています。"}],"correctIndex":3,"explanationJa":"talk about は話題、talk to は話す相手を示します。文脈の役割を見て選びます。","focusJa":"会話の話題と相手"}],"domainIds":["education","environment","communication","science"],"sourceReferences":[{"title":"Cambridge English Grammar Today: About","url":"https://dictionary.cambridge.org/grammar/british-grammar/about"}],"contentSha256":"9bd205292bdeb3bfbf1e716d0085b9bc20ef26fffff2ff9398d7d60d4132d373","review":{"status":"approved","method":"independent-ai-review","reviewer":"/root/bulk_audio_assets","reviewedAt":"2026-10-23T14:11:51.753Z","contentSha256":"9bd205292bdeb3bfbf1e716d0085b9bc20ef26fffff2ff9398d7d60d4132d373"},"audio":{"status":"not-generated"}},{"id":"prepositions-verb-preposition-patterns","series":"prepositions","titleJa":"動詞とセットで使う前置詞","levelTargets":["B1","B2","C1"],"goalJa":"依存・同意・謝罪・反対などの関係を、動詞の型に沿って正確に書く。","conceptJa":"depend on、listen to のような組合せは、空間のイメージだけでは決まりません。誰に・何について・何の理由で、という役割と一緒に句として覚えます。","commonTrapJa":"apologize to 人 for 行為 の2つの役割を逆にしないこと。object to の to は前置詞なので、動詞を続けるなら -ing 形にします。","usageNotes":["agree with a person/opinion と agree on a plan は、相手や合意内容への焦点が違います。","listen to ...、depend on ...、reply to ... を、自分が書ける短い文で覚えます。","同じ動詞でも別の意味や文型があるので、前置詞を一つの訳語だけで機械的に選ばないようにします。"],"examples":[{"id":"prepositions-verb-preposition-patterns-ex1","text":"The length of the experiment depends on the available equipment.","meaningJa":"実験の長さは、使える機材によって決まります。","contextJa":"条件への依存"},{"id":"prepositions-verb-preposition-patterns-ex2","text":"I apologized to my group for losing the interview notes.","meaningJa":"聞き取りのメモをなくしたことを、班の仲間に謝りました。","contextJa":"謝る相手と理由"},{"id":"prepositions-verb-preposition-patterns-ex3","text":"The committee agreed on a new recycling plan.","meaningJa":"委員会は新しいリサイクル計画について合意しました。","contextJa":"合意した内容"},{"id":"prepositions-verb-preposition-patterns-ex4","text":"Some students objected to sharing their personal data.","meaningJa":"個人データを共有することに反対する生徒もいました。","contextJa":"前置詞の後の動名詞"}],"contrasts":[{"leftEnglish":"I agree with Nao.","rightEnglish":"We agreed on a date for the interview.","noteJa":"人の考えに同意することと、具体的な合意内容を決めることを区別します。"},{"leftEnglish":"She apologized to the teacher.","rightEnglish":"She apologized for interrupting.","noteJa":"謝罪の相手と、謝罪する理由をそれぞれ示しています。"}],"questions":[{"id":"prepositions-verb-preposition-patterns-q1","type":"context","scenarioJa":"野外調査をするかどうかは天気に左右されます。","prompt":"Our decision will depend ___ the weather.","choices":[{"text":"of","feedbackJa":"この動詞の標準的な組合せではありません。"},{"text":"to","feedbackJa":"depend to という形では使いません。"},{"text":"on","feedbackJa":"depend on は条件に左右される意味です。"},{"text":"with","feedbackJa":"同行者を示す場面ではありません。"}],"correctIndex":2,"explanationJa":"depend on ... は読解・英作文でよく使うまとまりです。","focusJa":"depend on"},{"id":"prepositions-verb-preposition-patterns-q2","type":"context","scenarioJa":"レポートの遅れについて、先生に謝りました。","prompt":"I apologized ___ the teacher ___ submitting the report late.","choices":[{"text":"to / for","feedbackJa":"相手は to、謝る理由は for です。"},{"text":"for / to","feedbackJa":"相手と理由の役割が逆です。"},{"text":"on / with","feedbackJa":"この謝罪の文型には合いません。"},{"text":"with / of","feedbackJa":"この謝罪の文型には合いません。"}],"correctIndex":0,"explanationJa":"apologize to someone for doing something で、相手と行為を両方伝えられます。","focusJa":"相手と理由を分ける"},{"id":"prepositions-verb-preposition-patterns-q3","type":"meaning","scenarioJa":"“I agree with Mina about the need for quieter study spaces” と言いました。","prompt":"What does the speaker mean?","choices":[{"text":"Mina has agreed to do all the speaker’s work.","feedbackJa":"仕事を引き受けたとは述べていません。"},{"text":"The speaker is standing physically beside Mina.","feedbackJa":"物理的な位置の with ではありません。"},{"text":"The speaker refuses to hear Mina’s opinion.","feedbackJa":"同意と反対の内容です。"},{"text":"The speaker shares Mina’s opinion on this issue.","feedbackJa":"この論点で Mina と同じ考えです。"}],"correctIndex":3,"explanationJa":"agree with + 人 は、その人の意見への同意を表せます。","focusJa":"意見への同意"},{"id":"prepositions-verb-preposition-patterns-q4","type":"context","scenarioJa":"授業の前に、録音された説明の内容に注意して耳を傾けます。","prompt":"Please listen ___ the recorded instructions before you begin.","choices":[{"text":"at","feedbackJa":"listen のこの対象には to を使います。"},{"text":"to","feedbackJa":"聞く対象を示す組合せです。"},{"text":"into","feedbackJa":"この聞く対象を導く形ではありません。"},{"text":"of","feedbackJa":"この形では対象を導けません。"}],"correctIndex":1,"explanationJa":"listen to the instructions は説明に耳を傾けることです。listen for は音が聞こえるか注意を払う別の意味になり得ます。","focusJa":"listen to と意味の違い"},{"id":"prepositions-verb-preposition-patterns-q5","type":"context","scenarioJa":"個人情報を本人の同意なく集めることに反対しています。","prompt":"They object to ___ personal data without permission.","choices":[{"text":"collect","feedbackJa":"ここで to は不定詞の印ではありません。"},{"tex
